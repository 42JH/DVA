upstream dva_backend_keepalive { server backend:3000; keepalive 16; keepalive_requests 1000; keepalive_timeout 30s; }


map "$request_method:$uri" $auth_login_key {
    default '';
    ~*^POST:/api/auth/login/?$ $binary_remote_addr;
}
limit_req_zone $auth_login_key zone=auth_login:1m rate=30r/m;

server {
    listen 80;
    server_name _;
    # Preserve the DB-named call_session_seq request header.
    underscores_in_headers on;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_read_timeout 85s;
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_limited;
        # Only the established health/PBX routes use unprefixed backend paths.
        rewrite ^/api/(health|health/ready|webhooks/pbx/call-ended)$ /$1 break;
        proxy_pass http://dva_backend_keepalive;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @auth_limited {
        proxy_pass http://dva_backend_keepalive;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        proxy_set_header X-Dva-Auth-Limited 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
