upstream dva_backend_keepalive { server backend:3000; keepalive 16; keepalive_requests 1000; keepalive_timeout 30s; }

# Pre-deployment HTTP-only config. Keep the host port bound to 127.0.0.1
# until TLS termination and access policies are in place.
map $http_x_request_id $safe_request_id {
    default '';
    '~*^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' $http_x_request_id;
}
log_format observability escape=json '{"event":"proxy_request","statusCode":"$status","durationSeconds":"$request_time","requestId":"$safe_request_id"}';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout observability;
    # 오류 본문에는 URL이 포함될 수 있어 중앙 수집은 안전한 access log만 사용한다.
    error_log /dev/stderr crit;
    # Preserve the DB-named call_session_seq request header.
    underscores_in_headers on;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Internal readiness includes infrastructure status; do not expose it publicly.
    location = /api/health/ready {
        return 404;
    }

    location ~ ^/(?:api/)?internal(?:/|$) { return 404; }

    # Forward each active-call SSE event without buffering.
    location = /api/calls/active-count/stream {
        proxy_pass http://dva_backend_keepalive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 30s;
    }

    location /api/ {
        # 1MiB CSV plus multipart headers. The application enforces the file limit.
        client_max_body_size 2m;
        # Only the established health/PBX routes use unprefixed backend paths.
        rewrite ^/api/(health|health/ready|webhooks/pbx/call-ended)$ /$1 break;
        proxy_pass http://dva_backend_keepalive;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
