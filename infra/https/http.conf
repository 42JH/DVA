# Host Nginx. The container Nginx remains on 127.0.0.1:8082.
server {
    listen 80 default_server;
    server_name 192.0.2.10;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dva-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never receive webhook credentials or JSON over plaintext HTTP.
    location / { return 404; }
}
