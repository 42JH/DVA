server {
    listen 80 default_server;
    server_name 13.209.59.180;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dva-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name 13.209.59.180;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/dva-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dva-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DvaTLS:1m;
    ssl_session_tickets off;
    client_max_body_size 16k;
    client_body_timeout 10s;

    location = /https-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/webhooks/pbx/call-ended {
        # Method filtering happens before proxying; other application APIs stay internal.
        if ($request_method != POST) { return 405; }
        # Do not log query strings which might accidentally contain a provider URL/token.
        access_log off;
        proxy_pass http://127.0.0.1:8082/api/webhooks/pbx/call-ended;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    location / { return 404; }
}
