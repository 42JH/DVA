map "$request_method:$uri" $auth_login_key {
    default '';
    ~*^POST:/api/auth/login/?$ $binary_remote_addr;
}
limit_req_zone $auth_login_key zone=auth_login:1m rate=30r/m;

map $http_upgrade $jenkins_connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80 default_server;
    server_name 13.209.59.180;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dva-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name 13.209.59.180;
    # Preserve call_session_seq through both Nginx proxies.
    underscores_in_headers on;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/dva-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dva-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DvaTLS:1m;
    ssl_session_tickets off;
    client_max_body_size 16k;
    client_body_timeout 10s;

    location = /https-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/webhooks/pbx/call-ended {
        # Keep the PBX webhook POST-only.
        if ($request_method != POST) { return 405; }
        # Do not log query strings which might accidentally contain a provider URL/token.
        access_log off;
        mirror /_mirror/ai-pbx-call-ended;
        proxy_pass http://127.0.0.1:8082/api/webhooks/pbx/call-ended;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    # PBX는 백엔드 주소로만 보낸다. 같은 요청(본문·Bearer 토큰)을 AI에도 복사해 세션을 끝내게 한다. AI 응답은 무시된다.
    location = /_mirror/ai-pbx-call-ended {
        internal;
        access_log off;
        proxy_pass http://127.0.0.1:8000/pbx/webhook/call-ended;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    # AI 전화 접수 서버(dva-ai, 127.0.0.1:8000)가 받는 웹훅. 서명 검증은 앱이 한다.
    location = /api/webhooks/openai/call-incoming {
        if ($request_method != POST) { return 405; }
        access_log off;
        proxy_pass http://127.0.0.1:8000/api/webhooks/openai/call-incoming;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    # PBX는 통화 종료를 백엔드(/api/webhooks/pbx/call-ended)와 AI(여기) 양쪽에 보낸다.
    location = /pbx/webhook/call-ended {
        if ($request_method != POST) { return 405; }
        access_log off;
        proxy_pass http://127.0.0.1:8000/pbx/webhook/call-ended;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    # Swagger UI, its local assets and OpenAPI JSON share the existing API prefix.
    location ~ ^/api/docs(?:/.*|-json)?$ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        access_log off;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    # 내부 readiness는 외부에 공개하지 않는다.
    location ~ ^/api/health/ready(?:/|$) {
        return 404;
    }

    # Observability: internal metrics stay private; Grafana uses HTTPS.
    location ~ ^/(?:api/)?internal(?:/|$) { return 404; }

    # Add these locations inside the existing host HTTPS server; preserve all existing routes.
    # Existing ^/(?:api/)?internal(?:/|$) blocking must remain in place.
    location = /payment-test { return 404; }
    location ^~ /payment-test/ {
        access_log off;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }


    location = /grafana { return 301 /grafana/; }
    location ^~ /grafana/ {
        access_log off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jenkins_connection_upgrade;
        proxy_read_timeout 60s;
    }

    # Active-call SSE: the inner proxy may consume X-Accel-Buffering.
    location = /api/calls/active-count/stream {
        access_log off;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    # API 요청은 경로를 유지해서 백엔드 쪽으로 전달한다.
    location /api/ {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_limited;
        # 1MiB employee CSV plus multipart overhead; app validates the file.
        client_max_body_size 2m;
        access_log off;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    # Keep the app's JSON/CORS contract without parsing or hashing rejected credentials.
    location @auth_limited {
        access_log off;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        proxy_set_header X-Dva-Auth-Limited 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    location = /jenkins { return 301 /jenkins/; }
    # Keep the existing GitLab URL/token while selecting the monolith job by paths.
    location = /jenkins/project/dva-ci-linux-validation {
        proxy_pass http://127.0.0.1:8080/jenkins/generic-webhook-trigger/invoke;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 20m;
        access_log off;
    }
    location ^~ /jenkins/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jenkins_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
        client_body_timeout 60s;
        access_log off;
    }

    # AI 관제 화면(HTTP Basic은 AI 앱이 검사). 개인정보가 보이므로 GET만 연다
    location ~ ^/monitor(?:/api/.*)?$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        # SSE(/monitor/api/stream): 버퍼링을 끄고 오래 기다린다
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}

# OpenAI는 IP 주소 URL로 웹훅을 보내지 않아서, 같은 서버를 sslip.io 이름으로 받는다. AI 전화 수신 웹훅만 연다.
server {
    listen 443 ssl;
    server_name 13-209-59-180.sslip.io;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/dva-sslip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dva-sslip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DvaTLS:1m;
    ssl_session_tickets off;
    client_max_body_size 16k;
    client_body_timeout 10s;

    location = /api/webhooks/openai/call-incoming {
        if ($request_method != POST) { return 405; }
        access_log off;
        proxy_pass http://127.0.0.1:8000/api/webhooks/openai/call-incoming;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    location / { return 404; }
}
