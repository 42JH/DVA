map $http_upgrade $jenkins_connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80 default_server;
    server_name 13.209.59.180;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dva-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name 13.209.59.180;
    # Preserve call_session_seq through both Nginx proxies.
    underscores_in_headers on;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/dva-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dva-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DvaTLS:1m;
    ssl_session_tickets off;
    client_max_body_size 16k;
    client_body_timeout 10s;

    location = /https-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/webhooks/pbx/call-ended {
        # Keep the PBX webhook POST-only.
        if ($request_method != POST) { return 405; }
        # Do not log query strings which might accidentally contain a provider URL/token.
        access_log off;
        proxy_pass http://127.0.0.1:8082/api/webhooks/pbx/call-ended;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    # Swagger UI, its local assets and OpenAPI JSON share the existing API prefix.
    location ~ ^/api/docs(?:/.*|-json)?$ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        access_log off;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    # 내부 readiness는 외부에 공개하지 않는다.
    location ~ ^/api/health/ready(?:/|$) {
        return 404;
    }

    # API 요청은 경로를 유지해서 백엔드 쪽으로 전달한다.
    location ~ ^/(?:api/)?internal(?:/|$) { return 404; }

    location = /grafana { return 301 /grafana/; }
    location ^~ /grafana/ {
        access_log off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jenkins_connection_upgrade;
        proxy_read_timeout 60s;
    }

    location /api/ {
        # Allow the 1MiB employee CSV plus multipart overhead.
        client_max_body_size 2m;
        access_log off;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_next_upstream off;
    }

    location = /jenkins { return 301 /jenkins/; }
    # Keep the existing GitLab URL/token while selecting the monolith job by paths.
    location = /jenkins/project/dva-ci-linux-validation {
        proxy_pass http://127.0.0.1:8080/jenkins/generic-webhook-trigger/invoke;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 20m;
        access_log off;
    }
    location ^~ /jenkins/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jenkins_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
        client_body_timeout 60s;
        access_log off;
    }

    # AI 관제 화면(HTTP Basic은 AI 앱이 검사). 개인정보가 보이므로 GET만 연다
    location ~ ^/monitor(?:/api/.*)?$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        # SSE(/monitor/api/stream): 버퍼링을 끄고 오래 기다린다
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}
