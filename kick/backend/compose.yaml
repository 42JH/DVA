name: kick-backend

services:
  backend:
    image: ${KICK_BACKEND_IMAGE:-kick-backend:local}
    build: .
    environment:
      PGHOST: db
      PGDATABASE: kick
      PGUSER: kick
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KICK_TEST_ACCOUNT_1_TOKEN: ${KICK_TEST_ACCOUNT_1_TOKEN:-}
      KICK_TEST_ACCOUNT_2_TOKEN: ${KICK_TEST_ACCOUNT_2_TOKEN:-}
      KICK_TEST_ACCOUNT_3_TOKEN: ${KICK_TEST_ACCOUNT_3_TOKEN:-}
      KICK_TEST_ACCOUNT_4_TOKEN: ${KICK_TEST_ACCOUNT_4_TOKEN:-}
      KICK_TEST_ACCOUNT_5_TOKEN: ${KICK_TEST_ACCOUNT_5_TOKEN:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      KICK_TTS_FIXED_SETTINGS: ${KICK_TTS_FIXED_SETTINGS:-false}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      KICK_SIGNUP_CODE: ${KICK_SIGNUP_CODE:-}
      FCM_SERVICE_ACCOUNT_BASE64: ${FCM_SERVICE_ACCOUNT_BASE64:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KICK_BACKEND_PORT:-3010}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 6

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kick
      POSTGRES_USER: kick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kick -d kick"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
