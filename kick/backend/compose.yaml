name: kick-backend

services:
  backend:
    image: ${KICK_BACKEND_IMAGE:-kick-backend:local}
    build: .
    environment:
      PGHOST: db
      PGDATABASE: kick
      PGUSER: kick
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KICK_BACKEND_PORT:-3010}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 6

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kick
      POSTGRES_USER: kick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kick -d kick"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
