location = /kick/health {
    proxy_pass http://127.0.0.1:3010/health;
}

location = /kick/api/voice {
    limit_except GET POST { deny all; }
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:3010/api/voice;
}

location ~ "^/kick/api/(?:accounts(?:/me)?|devices/push|friends(?:/[a-z0-9-]{1,64})?|calls(?:/(?:active|events|[0-9a-fA-F-]{36}(?:/join)?))?|voice/speech(?:/stream)?)$" {
    rewrite ^/kick(/api/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
}
