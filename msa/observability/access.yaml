apiVersion: v1
kind: Namespace
metadata:
  name: dva-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: dva-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: dva-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: msa-observability-discovery
  namespace: dva
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: msa-observability-discovery
  namespace: dva
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: msa-observability-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: dva-observability
  - kind: ServiceAccount
    name: alloy
    namespace: dva-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: msa-observability-logs
  namespace: dva
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: msa-observability-logs
  namespace: dva
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: msa-observability-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: dva-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dva-msa-observability-kubelet
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dva-msa-observability-kubelet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dva-msa-observability-kubelet
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: dva-observability
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-ingress
  namespace: dva-observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-reads-prometheus
  namespace: dva-observability
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-writes-and-grafana-reads-loki
  namespace: dva-observability
spec:
  podSelector:
    matchLabels:
      app: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [alloy, grafana]
      ports:
        - port: 3100
