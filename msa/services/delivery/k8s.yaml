apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery
  namespace: dva
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dva-delivery
  template:
    metadata:
      labels:
        app: dva-delivery
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      containers:
        - name: delivery
          image: docker.io/library/dva-delivery:RELEASE_TAG
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3003"
            - name: DB_HOST
              valueFrom:
                secretKeyRef: {name: delivery-db, key: PGHOST}
            - name: DB_PORT
              valueFrom:
                secretKeyRef: {name: delivery-db, key: PGPORT}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: delivery-db, key: PGUSER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: delivery-db, key: PGPASSWORD}
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: delivery-db, key: PGDATABASE}
            - name: CUSTOMER_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: msa-customer-auth, key: customer-token}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /delivery/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /delivery/health/ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /delivery/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: delivery
  namespace: dva
spec:
  type: ClusterIP
  selector:
    app: dva-delivery
  ports:
    - name: http
      port: 3003
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delivery
  namespace: dva
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: __MSA_INGRESS_HOST__
      http:
        paths:
          - path: /delivery
            pathType: Prefix
            backend:
              service:
                name: delivery
                port:
                  number: 3003