
name: dva

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    expose:
      - "8000"
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    expose:
      - "3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      AUTH_PROXY_HOPS: "1"
      SECURITY_LOG_HMAC_KEY: ${SECURITY_LOG_HMAC_KEY:-}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      AI_AGENT_URL: http://ai:8000
      AI_BUSINESS_TOKEN: ${AI_BUSINESS_TOKEN:-}
      AI_PERSONA_TOKEN: ${AI_PERSONA_TOKEN:-}
      AI_FAQ_TOKEN: ${AI_FAQ_TOKEN:-}
      AI_INSIGHTS_TOKEN: ${AI_INSIGHTS_TOKEN:-}
      CALL_ANALYSIS_OPENAI_API_KEY: ${CALL_ANALYSIS_OPENAI_API_KEY:-}
      CALL_ANALYSIS_CONCURRENCY: ${CALL_ANALYSIS_CONCURRENCY:-2}
      DVER_API_URL: ${DVER_API_URL:-https://public-n8n.dvercorp.co.kr:47514/webhook/parcel}
      DVER_API_KEY: ${DVER_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_RECORDINGS_BUCKET: ${S3_RECORDINGS_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      RECORDING_ALLOWED_HOSTS: ${RECORDING_ALLOWED_HOSTS:-dvercorp-aicc-connect-dev-recordings.s3.ap-northeast-2.amazonaws.com}
      RECORDING_MATCH_WINDOW_SECONDS: ${RECORDING_MATCH_WINDOW_SECONDS:-30}
      PBX_WEBHOOK_TOKEN: ${PBX_WEBHOOK_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    networks:
      - web_net
      - ai_net
      - db_net
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  web_net:
    driver: bridge

  ai_net:
    driver: bridge

  db_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
