# 관리자 웹 블록 — 서버 /etc/nginx/sites-available/dva-ip 의 443 server 안, 맨 아래 `location / { return 404; }` 자리에 들어가 있음 (11/01)
# 전체 파일은 인프라 담당 소유(백엔드 · AI · Jenkins · Grafana 라우팅이 같이 있음) → 여기 블록만 참고용으로 둠. deploy.sh 는 설정을 안 만짐
# /api/ 는 같은 서버 블록의 기존 location 이 127.0.0.1:8082(백엔드)로 넘김 → 화면과 API 가 같은 origin 이라 세션 쿠키 · Origin 검사 그대로

    # 관리자 웹 (React 정적 빌드, 저장소 frontend/deploy). /api 는 위 블록이 백엔드로 넘겨 화면과 같은 origin
    root /var/www/dva;
    location ^~ /assets/ {
        expires 30d;                                   # 파일 이름에 해시가 있어 오래 캐시해도 됨
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;              # SPA: /calls/9101 같은 주소도 index.html
    }
