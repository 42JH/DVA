# 디버 관리자 웹 — Lightsail(Ubuntu 24.04 + nginx) 설정. deploy.sh가 /etc/nginx/sites-available/dva 로 복사함
# 정적 파일(dist) + /api 는 백엔드(EC2)로 그대로 넘김 → 브라우저엔 같은 origin 이라 세션 쿠키(SameSite=Lax) 그대로 동작
server {
    listen 80 default_server;
    server_name _;
    root /var/www/dva;

    location / {
        try_files $uri $uri/ /index.html;   # SPA: /calls/9101 같은 주소도 index.html
    }

    location /assets/ {
        expires 30d;                        # 파일 이름에 해시가 있어 오래 캐시해도 됨
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass https://13.209.59.180;   # /api/... 그대로 전달 (끝에 / 를 붙이면 /api 가 떨어짐)
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host 13.209.59.180;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # BE Origin 허용 목록에 이 서버 주소가 들어가기 전까지 임시 — 같은 origin 처럼 보이게 (BE가 추가하면 지울 것)
        # proxy_set_header Origin https://13.209.59.180;
        # HTTPS 없이 http://IP 로만 열 때 Secure 쿠키를 브라우저가 버리지 않게 (HTTPS 면 필요 없음)
        # proxy_cookie_flags dva_session nosecure;
    }
}
