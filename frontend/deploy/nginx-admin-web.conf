# 서버 /etc/nginx/snippets/dva-routes.conf 맨 아래 관리자 웹 블록을 그대로 옮긴 참고용 사본 (2026-11-20 기준)
# 서버 파일은 인프라 담당 소유(백엔드 · AI · Jenkins 경로가 같이 있음). 배포 스크립트는 nginx 설정을 바꾸지 않으므로 고칠 땐 서버에서 손으로 고치고 이 사본도 맞춤
# 압축 3줄: docs/fe-gzip-results.md · 보안 헤더 5줄 · CSP 차단 · HTTP/2: docs/troubleshooting.md
# HTTP/2는 이 블록이 아니라 /etc/nginx/sites-available/dva-ip 의 443 listen 3줄(listen 443 ssl http2)에 있음 — 443 전체에 적용

# 관리자 웹 (React 정적 빌드, 저장소 frontend/deploy). /api 는 위 블록이 백엔드로 넘겨 화면과 같은 origin
root /var/www/dva;
location ^~ /assets/ {
    gzip_types text/css application/javascript image/svg+xml application/json; # 관리자 웹만 압축 (11/12, 전역 gzip on 은 HTML만)
    gzip_vary on;
    gzip_comp_level 5;
    # 보안 헤더 (11/12 Lighthouse 권장사항, 관리자 웹만): https 고정 1년 · 다른 사이트 iframe 금지 · 새 창과 분리 · 파일 종류 추측 금지 · 다른 사이트로 주소 안 넘김
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 차단 (11/20): 주소 검색(kakao) 스크립트 · 창, 엑셀 읽기 Worker(blob:) 허용. 보고 전용(11/12~)에서 위반 없음 확인 뒤 전환
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://t1.kakaocdn.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://dva-d109-storage.s3.ap-northeast-2.amazonaws.com; media-src 'self' blob: https://dva-d109-storage.s3.ap-northeast-2.amazonaws.com; connect-src 'self'; frame-src https://postcode.map.kakao.com https://postcode.map.daum.net; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
location / {
    gzip_types text/css application/javascript image/svg+xml application/json; # 관리자 웹만 압축 (11/12, 전역 gzip on 은 HTML만)
    gzip_vary on;
    gzip_comp_level 5;
    # 보안 헤더 (11/12 Lighthouse 권장사항, 관리자 웹만): https 고정 1년 · 다른 사이트 iframe 금지 · 새 창과 분리 · 파일 종류 추측 금지 · 다른 사이트로 주소 안 넘김
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 차단 (11/20): 주소 검색(kakao) 스크립트 · 창, 엑셀 읽기 Worker(blob:) 허용. 보고 전용(11/12~)에서 위반 없음 확인 뒤 전환
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://t1.kakaocdn.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://dva-d109-storage.s3.ap-northeast-2.amazonaws.com; media-src 'self' blob: https://dva-d109-storage.s3.ap-northeast-2.amazonaws.com; connect-src 'self'; frame-src https://postcode.map.kakao.com https://postcode.map.daum.net; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri $uri/ /index.html;
}
