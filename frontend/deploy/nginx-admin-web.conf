# 서버 /etc/nginx/snippets/dva-routes.conf 맨 아래 관리자 웹 블록을 그대로 옮긴 참고용 사본 (2026-11-12 기준)
# 서버 파일은 인프라 담당 소유(백엔드 · AI · Jenkins 경로가 같이 있음). 배포 스크립트는 nginx 설정을 바꾸지 않으므로 고칠 땐 서버에서 손으로 고치고 이 사본도 맞춤
# 압축 3줄 경위 · 결과: docs/fe-gzip-results.md

# 관리자 웹 (React 정적 빌드, 저장소 frontend/deploy). /api 는 위 블록이 백엔드로 넘겨 화면과 같은 origin
root /var/www/dva;
location ^~ /assets/ {
    gzip_types text/css application/javascript image/svg+xml application/json; # 관리자 웹만 압축 (11/12, 전역 gzip on 은 HTML만)
    gzip_vary on;
    gzip_comp_level 5;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
location / {
    gzip_types text/css application/javascript image/svg+xml application/json; # 관리자 웹만 압축 (11/12, 전역 gzip on 은 HTML만)
    gzip_vary on;
    gzip_comp_level 5;
    try_files $uri $uri/ /index.html;
}
