# Container Nginx stays on localhost. Host Nginx terminates public IP HTTPS
# and forwards only the PBX webhook. See infra/https/README.md.
name: dva-prod

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in the environment file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment file}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ai:
    image: ${AI_IMAGE:?Set AI_IMAGE to a built image tag}
    expose:
      - "8000"
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a built image tag}
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?Set DB_USER in the environment file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment file}
      DB_NAME: ${DB_NAME:?Set DB_NAME in the environment file}
      AI_AGENT_URL: http://ai:8000
      PBX_WEBHOOK_TOKEN: ${PBX_WEBHOOK_TOKEN:?Set the server-only PBX webhook token}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    networks:
      - web_net
      - ai_net
      - db_net
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    ports:
      # Host Nginx handles public 80/443; do not expose container/DB/AI ports.
      - "127.0.0.1:8082:80"
    volumes:
      - ./infra/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  web_net:
    driver: bridge
  ai_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
