[project]
name = "dpostcall-ai"
version = "0.1.0"
description = "디포스트콜 전화 접수 서버"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai[realtime]",
    "psycopg[binary,pool]",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
