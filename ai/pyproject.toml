[project]
name = "dpostcall-ai"
version = "0.1.0"
description = "디포스트콜 전화 접수 서버"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai[realtime]==3.35.1",
    "langgraph>=1.2.16",
    "langchain-core>=1.6.13",
    "langchain-openai>=1.7.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "rank-bm25>=0.2.2",
    "kiwipiepy>=0.24.1",
    "tiktoken>=0.14.0",
    "qdrant-client==1.19.1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.37",
    "pytest",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
