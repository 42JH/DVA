[project]
name = "dpostcall-rebuild-modules"
version = "0.1.0"
description = "디바콜 전화 접수 서버 재구성용 모듈(PBX 웹훅·백엔드 통신·도구와 RAG·주소 보정)"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic",
    "openai[realtime]==3.35.1",
    "langchain-core>=1.6.13",
    "langchain-openai>=1.7.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "rank-bm25>=0.2.2",
    "kiwipiepy>=0.24.1",
    "tiktoken>=0.14.0",
    "qdrant-client==1.19.1",
    "uvicorn>=0.54.0",
    # call_analysis(통화 불만 판정, 후처리) 녹음 분석. 다른 라이브러리가 이미 끌고 오던 것을 직접 적음
    "numpy>=2.3",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pbx_webhook/tests", "backend_client/tests", "app/tests", "call_analysis/tests", "tests"]
pythonpath = ["."]
