[project]
name = "dpostcall-ai"
version = "0.1.0"
description = "디포스트콜 전화 접수 서버"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai[realtime]",
    "langgraph>=1.2.16",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.37",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
