# 시험 시나리오. ID · 고객 발화 · 확인 항목은 AI 파트 문서 "AI 상담원 테스트 시나리오"(develop-ai cdc018d6 기준)에서 가져왔다.
#
# lines   고객이 말할 대본. 순서대로 틀지 않고, 가짜 고객이 AI가 방금 물은 것에 맞는 문장을 고른다(customer.py).
#         숫자는 실행기가 한글 읽기로 바꿔 TTS에 준다. 읽기를 직접 정하려면 say = "..."를 덧붙인다.
#         "(무응답)" = 그 차례에는 아무 말도 하지 않는다.
#         optional = true: AI가 그 질문을 하지 않으면 안 쓰여도 되는 문장(예 · 아니오 답). 표시가 없는 문장을 다 말하지 못하면 실패다.
# customer = true  등록 고객([data.customer])으로 전화한다. 주소록 · 기존 주문도 함께 심는다. 없으면 처음 이용하는 고객.
# expect  코드로 비교하는 정답. outcome = registered(택배 접수) | none(접수 없음) | lookup(조회) | cancelled(취소)
#         보내는 분은 적지 않으면 발신번호 · 등록 고객의 이름과 발송 주소여야 한다.
# checks  모델이 통화를 보고 판정하는 행동 확인 항목(문서의 "확인"). 넓게 읽히지 않게 구체적으로 적는다.
# say  TTS가 읽을 글을 직접 정한다. 지금 "010-7777-8888이요."는 "…입니다"로 읽힌다 — AI가 "…이요"로 끝나는 번호를 자릿수 오류로 거절해서(11/12) 둔 임시 조치다. 고쳐지면 say를 지운다.
# core = true  프롬프트를 고칠 때마다 돌리는 핵심 묶음.
# max_sec  이 시나리오의 통화 길이 상한(초). 없으면 실행기 기본값.

