# 배포 서버에서만 compose.yaml 위에 덧붙인다(로컬 개발에는 없는 외부 네트워크라서 분리).
# 백엔드 스택(dva-prod)이 정한 네트워크: 백엔드 → http://ai:8000, AI → BACKEND_API_URL(http://backend:3000)
services:
  ai:
    networks:
      backend:
        aliases:
          - ai
    # 통화 로그는 릴리스 폴더(./logs)가 아니라 볼륨에 남긴다(릴리스마다 흩어지지 않게, appuser 쓰기 권한)
    volumes:
      - ai_logs:/app/logs

volumes:
  ai_logs:

networks:
  backend:
    external: true
    name: dva-prod_ai_net
