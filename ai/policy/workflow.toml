origin_confirm = "sender_change_next가 없을 때만 기존 발송 주소를 쓸지 한 번 확인한다. registered이면 '등록된 발송 주소로 보내실까요?'라고 묻고 주소는 다시 읽지 않는다. 주소 값이면 '{그 주소}에서 발송하시나요?'라고 묻는다"
