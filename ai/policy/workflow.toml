# Workflow Policy (docs/architecture/workflow-policy.md). 이 파일 하나에서
#   ① Live 지시문(app/policy/render.py render_live) ② Backend 지시문(render_backend)
#   ③ 서버 판정(app/domain/assess.py) ④ Decision 질문(decision_questions) ⑤ 결과 문구 검사(app/domain/claims.py)
# 를 만든다. 업무 규칙 출처: docs/call-flow/README.md "반드시 지킬 것", decisions.md P1·P5·P6·P8·P11.
version = "2026-11-09.2"

# 전화 접수 제한의 단일 출처. Live·Responses·도구 스키마·서버 검사가 함께 사용한다.
# 수량 단위: 현재 받는 곳별 접수 묶음(parcel). 서로 다른 접수 묶음을 자동 병합하지 않는다.
[input_limits]
item_price_min = 1
item_price_max = 100_000_000
box_total_max = 10
document_max = 100

# 전화 접수에 적용하는 배송 FAQ 물품 규칙. terms는 전사에서 후보를 찾을 때 사용한다.
[parcel_items]
max_side_cm = 160
max_weight_kg = 30

[parcel_items.rules.cash_equivalents]
kind = "prohibited"
terms = ["현금", "지폐", "동전", "어음", "수표", "유가증권"]
guidance = "현금·어음·수표·유가증권 등 현금화할 수 있는 물품은 보낼 수 없습니다."

[parcel_items.rules.dangerous_goods]
kind = "prohibited"
terms = ["독극물", "농약", "폭발물", "폭죽", "총포", "총기", "도검"]
guidance = "독극물·폭발물·총포류·도검류는 보낼 수 없습니다."

[parcel_items.rules.animals]
kind = "prohibited"
terms = ["살아있는 동물", "살아 있는 동물", "동물 사체", "살아있는 강아지", "살아있는 고양이", "반려동물"]
guidance = "살아있는 동물이나 동물 사체는 보낼 수 없습니다."

[parcel_items.rules.valuables]
kind = "prohibited"
terms = ["귀금속", "보석", "골동품", "미술품", "금괴", "고가품", "대체 불가"]
guidance = "귀금속·보석·골동품·미술품 등 고가이거나 대체하기 어려운 물품은 접수할 수 없습니다."

[parcel_items.rules.flammables]
kind = "prohibited"
terms = ["인화성", "가연성", "라이터", "스프레이", "부탄", "가스통", "압축가스", "압축공기", "가스를", "가스만"]
guidance = "인화성·가연성 물질과 가스·압축공기는 보낼 수 없습니다."

[parcel_items.rules.batteries]
kind = "conditional"
terms = ["배터리", "보조배터리", "건전지"]
guidance = "배터리만 따로 보내는 것은 접수할 수 없습니다. 기기에 장착된 상태인지 확인해 주세요."

[parcel_items.rules.perishables]
kind = "prohibited"
terms = ["냉장", "냉동", "부패", "변질", "아이스크림", "생고기"]
guidance = "냉장·냉동이 필요하거나 부패·변질되기 쉬운 물품은 접수할 수 없습니다."

[parcel_items.rules.liquids]
kind = "conditional"
terms = ["액체", "음료", "화장품", "샴푸", "주스", "향수"]
guidance = "액체류는 누수 방지 포장이 필요합니다. 새지 않게 포장했는지 확인해 주세요."

[parcel_items.rules.fragile]
kind = "conditional"
terms = ["유리컵", "유리병", "유리 제품", "유리 그릇", "유리를", "유리가", "유리만", "도자기", "깨지기 쉬운"]
guidance = "깨지기 쉬운 물품은 완충 포장이 필요합니다. 완충재로 감싸 포장했는지 확인해 주세요."

[parcel_items.rules.restricted_goods]
kind = "prohibited"
terms = ["의약품", "마약", "음란물", "처방약", "불법 물품"]
guidance = "의약품·마약류·음란물 등 FAQ에서 운송을 제한한 물품은 접수할 수 없습니다."

[parcel_items.rules.format]
kind = "format"
terms = ["쇼핑백", "비닐봉지", "스티로폼", "박스 없이", "포장 없이"]
guidance = "서류와 소형·중형·대형 박스로 접수합니다. 지원하는 규격으로 포장할 수 있는지 확인해 주세요."

# 기존 전화번호 허용 범위를 유지한다. 한글 숫자/+82 정규화 뒤 적용한다.
[phone]
mobile_prefix = "010"
mobile_digits = 11
domestic_min_digits = 9
domestic_max_digits = 11
service_prefixes = ["15", "16", "18"]
service_digits = 8

# --- 필드 목록. 이름은 Business State·BE 매핑과 같다(backend_client/order.py) ---
# kind: free = Backend가 strict 도구 인자로 추출(Live가 위임) · choice = Decision 질문 · auto = 서버가 채움(묻지 않음)
# scope: parcel = 택배마다 · call = 통화당 1개
[fields.sender_name]
label = "보내는 분 성함"
kind = "free"
[fields.sender_phone]
label = "보내는 분 연락처"
kind = "auto"                 # 발신번호. 묻지도 읽지도 않는다
[fields.sender_address]
label = "발송 주소"
kind = "free"
[fields.sender_address_detail]
label = "보내는 곳 상세주소(동·호수)"
kind = "free"
[fields.receiver_name]
label = "받는 분 성함"
kind = "free"
[fields.receiver_phone]
label = "받는 분 연락처"
kind = "free"
[fields.receiver_address]
label = "받는 곳 주소"
kind = "free"
[fields.receiver_address_detail]
label = "받는 곳 상세주소(동·호수)"
kind = "free"
[fields.items]
label = "물품(서류·박스 크기와 개수)"
kind = "free"
[fields.item_price]
label = "박스 안 물건의 대략적인 가액 합계"
kind = "free"
# 결제 방식은 필드가 아니다: 묻지도 안내하지도 않고 서버가 고객 자격으로 정한다(app/domain/assess.auto_payment, 2026-11-05)

# --- 단계(받는 순서 고정: README "반드시 지킬 것" 1). required 순서가 곧 묻는 순서 ---
[[stage]]
id = "intent"
goal = "고객의 용건(접수·조회·취소·문의·상담원)을 파악한다"
decision = "intent"

[[stage]]
id = "sender"
goal = "보내는 분 성함을 받는다. 보내는 분 연락처는 발신번호로 채우고 묻지 않는다"
required = ["sender_name"]
decision = "collect"

[[stage]]
id = "receiver"
goal = "받는 분 성함과 연락처를 받는다"
required = ["receiver_name", "receiver_phone"]
decision = "collect"

[[stage]]
id = "address"
goal = "발송 주소·상세, 받는 곳 주소·상세 순으로 받는다. 두 주소가 다 갖춰지면 서버 결과 confirm_route로 동 이름만 확인한다"   # 사용자 결정 2026-11-09
required = ["sender_address", "sender_address_detail", "receiver_address", "receiver_address_detail"]
decision = "collect"

[[stage]]
id = "item"
goal = "물품 구성을 먼저 받는다. 박스가 있으면 박스 안 물건의 대략적인 가액 합계를 받는다. 서류만 있으면 가액은 서버가 채운다. 무게는 묻지 않는다"
required = ["items", "item_price"]
decision = "collect"

[[stage]]
id = "readback"
goal = "서버가 준 확인 내용을 그대로 읽고 맞는지 묻는다"
gate = "server"
decision = ["confirm", "collect"]

[[stage]]
id = "more_parcels"
goal = "더 보낼 택배가 있는지 묻는다. 담은 택배는 접수 전까지 고객 요청 시 수정할 수 있다"   # P5
decision = ["more", "collect"]

[[stage]]
id = "closing"
goal = "서버가 준 접수 결과로만 마무리 인사를 한다"
gate = "server"
decision = "collect"          # 문의·끝내기(end)를 계속 듣는다(S5: closing에서 질문이 없어 "끊어주세요"를 못 들음)

[pickup]
# 수거 요청 시각(사용자 결정 2026-11-04 a, BE 계약 backend/docs/ai-call-follow-up.md). 서버가 기본값을 정하고 되읽기 때 안내,
# 고객이 원하면 아래 범위에서 바꾼다. BE는 pickupRequestedAt을 보존(결제가 늦으면 BE가 결제+1시간을 09~17시로 맞춤)
min_lead_minutes = 60         # 지금부터 최소 1시간 뒤
open = "09:00"
close = "17:00"               # 정각 허용
max_days_ahead = 3            # 현재 시각부터 정확히 3일(72시간) 이내
next_day_default = "09:00"    # 오늘 영업 시간을 넘기면 다음 날 이 시각

[reask]
max_attempts = 3              # 같은 항목 3회 실패 → 다른 방법 제안 → 상담원 제안
vary_wording = true

[confirm]
yes_min = 0.7                 # G4 θ_yes (S5에서 대본으로 조정)
change_max = 0.3              # change 확률이 이 이상이면 yes로 보지 않음
answer_after_readback_tolerance_ms = 300   # G3 허용오차

[address]
ambiguous = "auto_select_top" # P6

[forbid]
items = [
  "서버가 확인하지 않은 주소·전화번호를 확정된 것처럼 말하기",
  "접수 완료·취소 완료·요금·조회 결과를 서버 결과 없이 말하기",
  "서버가 확인 내용을 주기 전에 주문 내용을 되읽거나 확정 질문하기",
  "발신번호, 주소록에 저장된 번호·상세주소를 먼저 읽어 주기(고객이 직접 말한 값은 요청하면 다시 읽어 준다)",
  "결제 안내를 보냈다고 말하기",
  "확인 대기 중 고객 확인 없이 '접수 진행하겠다·진행 중이다'라고 말하기. 다른 질문에 답했으면 '이대로 접수할까요?'로 끝낸다",
  "스스로 통화 종료하기",
]
# 서버 결정적 문구 검사(delegation.md §6.2-5). 정상 안내에도 쓰는 말("확인했습니다")은 넣지 않는다
# 문장에 아래 말이 있으면 단정이 아니다(부정·미래·물음) — S5 실통화: "접수 완료 결과는 확인되지 않았습니다"를 잘못 잡음
claim_skip = ["않", "아직", "전에", "안 됐", "안됐", "못", "없", "는지", "인지", "예정", "하겠", "드릴게", "할게", "되면", "될 ", "진행"]
[[forbid.claims]]
phrases = ["접수되었", "접수됐", "접수 완료", "접수완료"]
unless = "result_accepted"
[[forbid.claims]]
phrases = ["취소되었", "취소됐", "취소 완료", "취소완료"]
unless = "cancel_done"
# 확인 대기 중 확인 없이 진행한다는 말(2026-11-03 통화 512a1b: "접수 진행하겠습니다"). 미래형이라 claim_skip을 쓰지 않는다
# 접수·취소 대상이 붙은 표현만 잡는다. "상담원 연결 진행해 드릴게요"처럼 다른 업무의 진행 안내는 잡지 않는다(S15P31D109-144)
[[forbid.claims]]
phrases = ["접수 진행하겠", "접수 진행할게", "접수 진행해 드", "접수 진행 요청 확인", "접수 진행 중입니다", "접수 진행 중이에요",
           "접수를 진행하겠", "접수를 진행할게", "접수를 진행해 드", "접수 처리 진행하겠",
           "취소 진행하겠", "취소 진행할게", "취소 진행해 드", "취소 진행 요청 확인", "취소 진행 중입니다", "취소 진행 중이에요",
           "취소를 진행하겠", "취소를 진행할게", "취소를 진행해 드", "취소 처리 진행하겠",
           "이대로 진행하겠", "이대로 진행할게", "이대로 진행해 드"]
unless = "no_pending"
use_skip = false

[speech]                      # 읽는 규칙(README §5). P8: 지금은 사실·금지 표현만
phone = "고객이 직접 불러 준 번호만 숫자를 끊어 읽는다"
address = "주소를 다시 물을 때는 시·구와 도로명·건물번호로 읽는다. 확인(confirm_route·readback)에서는 서버가 준 동 이름만 말하고 도로명·번지·상세주소는 읽지 않는다"
amount = "접수번호와 요금은 서버가 준 값만 말한다"
pickup = "수거 시각은 먼저 묻지 않는다. 서버 결과 pickup의 시각을 되읽기 때 안내하고, 고객이 바꾸고 싶어 하면 그 시각을 맡긴다"

# --- 서버 결과 읽는 법(Live 지시문에 렌더링). 서버는 사실(JSON)만 보낸다 — 키의 뜻을 여기서 정한다 ---
[results]
parcel_added = "이 택배를 담았다. '담아 두었다'고 안내하고 더 보낼 택배가 있는지 묻는다. 실제 접수 시점은 draft_intake가 오면 그 값을 따른다. 접수 완료라고 말하지 않는다"
draft_intake = "고객이 확인한 택배 정보는 통화 중에 바로 저장된다. 조회 결과는 다른 접수 건과 같은 방식으로 상태를 안내하고, 언제 처리되는지는 따로 덧붙이지 않는다"
readback = "접수 확인 내용(sender_name·from·to·receiver_name). '{sender_name}님이 {from}에서 {to}의 {receiver_name}님께 보내시는 것으로 확인했습니다. 이대로 접수할까요?'처럼 한 문장으로 말하고 반드시 질문으로 끝낸다(고객이 그 질문을 끝까지 듣고 답해야 확정된다). 주소·연락처·물품·가액은 다시 읽지 않는다"
missing = "현재 택배에 아직 받지 못한 필수 항목"
needs = "다시 물어야 할 항목과 사유(예: PHONE_INVALID_DIGITS = 자릿수가 맞지 않음)"
confirm_area = "상호·건물 이름만으로 찾은 주소의 시·군·구와 동(주소 항목별, 예: 강남구 역삼동). 도로명·번지는 읽지 않고 '{값} 맞나요?'처럼 한 번 확인한다. 아니라고 하면 어느 지역의 지점인지 묻고 그 답을 맡긴다"
phones_to_read = "고객이 이번 통화에서 직접 불러 주고 서버가 이 목록에 표시한 번호를 한 번 끊어 읽어 확인한다"
confirm_route = "발송 주소와 받는 곳 주소가 다 갖춰졌을 때의 동 이름(from·to). '{from}에서 {to}으로 보내시는군요.'처럼 한 번 말해 확인하고 다음 항목을 묻는다. 도로명·번지는 읽지 않는다. confirm_area와 같이 오면 '{from}에서 {to}으로 보내시는 거 맞나요?'처럼 한 문장의 질문으로 합친다. 아니라고 하면 어느 주소가 틀렸는지 묻고 그 답을 맡긴다"
more_parcels = "false면 더 보낼 택배가 없다"
call_started = "true면 전화가 연결된 것이다. 고객 말을 기다리지 않고 바로 첫 인사를 한다(인사 규칙대로, 한 번만)"
closing = "true면 진행한 접수가 있을 때 함께 온 주문 결과를 먼저 안내하고 정해진 마무리 인사를 한 번 한다. 전화는 서버가 끊는다"
unverified = "방금 말한 것 중 사실이 아닌 표현. truth의 값이 사실이다. 바로잡아 안내한다"
cancel = "취소 결과: done=취소됨, already=이미 취소된 접수, locked=결제가 끝나 전화로 취소 불가, unknown=확인 중(완료라고 말하지 않는다)"
agent = "상담원 연결 상태. 바로 연결한다고 말하는 것은 transferring일 때만 한다. suggest = 상담원 연결을 권한다. transferring = '담당 상담원에게 바로 연결해 드리겠습니다. 잠시만 기다려 주세요'라고 한 번 말한다(말이 끝나면 서버가 전화를 넘긴다). callback_offer = 지금은 상담원 연결 가능 시간이 아니다 — '죄송하지만 지금은 상담원 연결 가능 시간이 아니라 연결이 어렵습니다. 지금 거신 번호로 담당자가 다음 영업일 오전에 먼저 연락드려도 될까요?'라고 묻는다. callback_registered = 연락드리겠다고 안내한다. callback_declined = 알겠다고 하고 하던 일로 돌아간다. transfer_failed = 연결이 되지 않았다고 사과하고 callback_offer처럼 묻는다. not_configured = 지금은 바로 연결이 안 된다, 담당자가 확인 후 연락드린다고 안내한다"
unavailable = "status가 unavailable이면 시스템 문제다. 고객 탓으로 말하지 않고 지금 확인이 어렵다고 안내한다"
confirmation = "확인 대기 상태. ask_again이면 readback 값을 짧게 되읽고 '이대로 접수할까요?'로 묻는다(고객이 그 질문에 답해야 확정된다). cancel_target과 함께 오면 그 접수를 취소할지 다시 묻는다. 아직 접수·취소되지 않았으니 처리했다고 말하지 않는다. cancelled_by_customer면 고객이 고친 값을 받아 기록한다"
pickup = "수거 요청 시각. at = 안내할 시각(한국 시간), today_unavailable이 true면 '금일 수거는 어렵고 익일 수거가 가능합니다'를 먼저 말한다. allowed = 고객이 바꿀 수 있는 범위(거절 사유 PICKUP_TOO_SOON·PICKUP_OUT_OF_HOURS·PICKUP_TOO_FAR일 때 이 범위로 다시 묻는다)"
origin = "발송 주소. prefilled = 기존 정보로 보내는 분 성함·주소·상세를 채웠다(다시 묻지 않고 저장된 상세주소는 읽지 않는다). name_only = 성함만 채웠으므로 발송 주소를 묻는다"
origin_confirm = "기존 출발지를 쓸지 '{그 주소}에서 발송하시나요?'라고 한 번 묻는다"
resume_confirm = "직전 통화에서 끝내지 못한 접수가 있다. receiver_name이 있으면 '아까 {받는 분} 님께 보내시던 택배 접수를 이어서 진행할까요?', 없으면 '아까 접수하시던 택배를 이어서 진행할까요?'라고 한 번 묻는다. 다른 질문(출발지 등)은 답을 들은 뒤에 한다"
resume = "이어받기 결과. loaded = 이전 접수 내용을 불러왔다 — readback이 오면 그대로 되읽어 확인받고, 아니면 missing의 첫 항목만 묻는다(불러온 값은 다시 묻지 않는다). declined = 새로 접수한다. unavailable = 이전 접수를 불러오지 못했다고 짧게 말하고 새로 접수한다"
order = "통화 결과(주문) 상태. ACCEPTED만 접수 완료(parcelNo가 있으면 접수번호로 안내). 그 외에는 guidance가 있으면 그 내용을 안내하고, 없으면 '접수 내용은 담당자가 확인 후 안내드린다'로 마무리한다"
submitted = "order가 submitted면 접수가 이미 넘어가 이 통화에서는 택배를 고치거나 더 담을 수 없다. 바꿨다·담았다고 말하지 않고, 변경은 담당자가 확인 후 연락드린다고 안내한다"

# --- Decision 질문(서버가 고객 발화 끝에 POST /v1/decisions로, delegation.md §3.2). 선택형만 ---
[[decision.intent.questions]]
name = "task"
type = "choice"
choices = ["order", "lookup", "cancel", "inquiry", "agent", "end", "chit_chat", "unclear"]
instructions = "고객 발화의 용건을 고른다. 택배 접수 정보 제공은 order, 보낸 택배 조회는 lookup, 취소는 cancel, 서비스 질문은 inquiry, 상담원 요청은 agent, 명확한 통화 종료는 end, 인사·맞장구·대기 요청은 chit_chat. 직전 AI 발화가 통화를 끝낼지 물었고 고객이 동의하면 end. 접수 중단인지 통화 종료인지 불분명하면 unclear. 직전 AI 발화가 택배 접수를 도와드릴지 물었고 고객이 동의하거나 진행을 바라면(예·네·해 주세요·아뇨 그냥 해 주세요) order. 출발지가 다르다고 해도 택배를 보내려는 것이면 order(예: '아니요 오늘은 회사에서 발송해요'). 직전 AI 발화가 상담원 연결을 권했고 고객이 동의하면 agent."

[[decision.collect.questions]]
name = "switch"
type = "choice"
choices = ["none", "edit_parcel", "lookup", "cancel", "inquiry", "agent", "end"]
instructions = "고객이 하던 업무와 다른 일을 하려는지 고른다. 상담원 연결이나 통화 종료를 명확히 요청하면 확인 답이 섞여 있어도 각각 agent 또는 end다. 직전 AI 발화가 통화를 끝낼지 물었고 고객이 동의하면 end. 접수 중단인지 통화 종료인지 불분명하면 none. 직전 AI 발화가 상담원 연결을 권했고 고객이 동의하면 agent. 접수 정보를 말하거나 질문에 답하면 none, 이미 담은 택배를 고치려 하면 edit_parcel, 보낸 택배 조회는 lookup, 취소는 cancel, 서비스 질문은 inquiry."

[[decision.confirm.questions]]
name = "confirm"
type = "choice"
choices = ["yes", "no", "change", "proceed", "not_answer"]
instructions = "고객이 상담원 연결이나 통화 종료를 요청하거나, 직전 연결·종료 질문에 답하면 not_answer. 직전 AI 발화가 접수 또는 취소 내용이 맞는지 묻는 확인 질문이고 고객 발화가 그 답이면 고른다: 맞다=yes, 아니다=no, 다른 값으로 고쳐 말함=change. 직전 AI 발화가 확인 질문이 아닌데 고객이 접수를 진행해 달라고 하면(그럼 접수해 주세요·이어서 해 주세요) proceed. 그 밖은 not_answer."

[[decision.more.questions]]
name = "more"
type = "choice"
choices = ["more", "no_more", "not_answer"]
instructions = "직전 AI 발화가 더 보낼 택배가 있는지 물었고 고객이 답했으면 고른다: 더 있다=more, 없다(아니요·없어요·그게 다예요)=no_more. 그 질문의 답이 아니면 not_answer."

[[decision.callback.questions]]
name = "callback"
type = "choice"
choices = ["yes", "no", "not_answer"]
instructions = "직전 AI 발화가 상담원 대신 담당자가 나중에 연락드려도 되는지 물었고 고객이 답했으면 고른다: 좋다=yes, 싫다=no. 답이 아니면 not_answer."

[[decision.resume.questions]]
name = "resume"
type = "choice"
choices = ["yes", "no", "not_answer"]
instructions = "직전 AI 발화가 이전에 하던 택배 접수를 이어서 진행할지 물었고 고객이 답했으면 고른다: 이어서 한다·네·그거요=yes, 새로 한다·아니요·다른 거예요=no. 그 질문의 답이 아니면 not_answer."

[[decision.origin.questions]]
name = "origin"
type = "choice"
choices = ["yes", "no", "not_answer"]
instructions = "직전 AI 발화가 고객의 등록된 출발지나 이전에 보낸 곳에서 발송하는지 물었고(예: '…에서 발송하시는 택배 접수 도와드릴까요?', '…에서 발송하시나요?') 고객이 답했으면 고른다: 그곳에서 발송·네·접수해 달라=yes, 다른 곳에서 발송=no. 접수 제안에 '아니요'라고만 하거나 주소 질문의 답이 아니면 not_answer."
