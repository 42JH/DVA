# Workflow Policy (docs/architecture/workflow-policy.md). 이 파일 하나에서
#   ① Live 지시문(app/policy/render.py render_live) ② Backend 지시문(render_backend)
#   ③ 서버 판정(app/domain/assess.py) ④ Decision 질문(decision_questions)
# 를 만든다. 업무 규칙 출처: docs/call-flow/README.md "반드시 지킬 것", decisions.md P1·P5·P6·P8·P11.
version = "2026-11-05.3"

# 전화 접수 제한의 단일 출처. Live·Responses·도구 스키마·서버 검사가 함께 사용한다.
# 수량 단위: 현재 받는 곳별 접수 묶음(parcel). 서로 다른 접수 묶음을 자동 병합하지 않는다.
[input_limits]
item_price_min = 1
item_price_max = 100_000_000
box_total_max = 10
document_max = 100

# 전화 접수에 적용하는 배송 FAQ 물품 규칙. terms는 전사에서 후보를 찾을 때 사용한다.
[parcel_items]
max_side_cm = 160
max_weight_kg = 30

[parcel_items.rules.cash_equivalents]
kind = "prohibited"
terms = ["현금", "지폐", "동전", "어음", "수표", "유가증권"]
guidance = "현금·어음·수표·유가증권 등 현금화할 수 있는 물품은 보낼 수 없습니다."

[parcel_items.rules.dangerous_goods]
kind = "prohibited"
terms = ["독극물", "농약", "폭발물", "폭죽", "총포", "총기", "도검"]
guidance = "독극물·폭발물·총포류·도검류는 보낼 수 없습니다."

[parcel_items.rules.animals]
kind = "prohibited"
terms = ["살아있는 동물", "살아 있는 동물", "동물 사체", "살아있는 강아지", "살아있는 고양이", "반려동물"]
guidance = "살아있는 동물이나 동물 사체는 보낼 수 없습니다."

[parcel_items.rules.valuables]
kind = "prohibited"
terms = ["귀금속", "보석", "골동품", "미술품", "금괴", "고가품", "대체 불가"]
guidance = "귀금속·보석·골동품·미술품 등 고가이거나 대체하기 어려운 물품은 접수할 수 없습니다."

[parcel_items.rules.flammables]
kind = "prohibited"
terms = ["인화성", "가연성", "라이터", "스프레이", "부탄", "가스통", "압축가스", "압축공기", "가스를", "가스만"]
guidance = "인화성·가연성 물질과 가스·압축공기는 보낼 수 없습니다."

[parcel_items.rules.batteries]
kind = "conditional"
terms = ["배터리", "보조배터리", "건전지"]
guidance = "배터리만 따로 보내는 것은 접수할 수 없습니다. 기기에 장착된 상태인지 확인해 주세요."

[parcel_items.rules.perishables]
kind = "prohibited"
terms = ["냉장", "냉동", "부패", "변질", "아이스크림", "생고기"]
excluded_terms = ["냉장냉동고", "냉장고", "냉동고"]
guidance = "냉장·냉동이 필요하거나 부패·변질되기 쉬운 물품은 접수할 수 없습니다."

[parcel_items.rules.liquids]
kind = "conditional"
terms = ["액체", "음료", "화장품", "샴푸", "주스", "향수"]
guidance = "액체류는 누수 방지 포장이 필요합니다. 새지 않게 포장했는지 확인해 주세요."

[parcel_items.rules.fragile]
kind = "conditional"
terms = ["유리컵", "유리병", "유리 제품", "유리 그릇", "유리를", "유리가", "유리만", "도자기", "깨지기 쉬운"]
guidance = "깨지기 쉬운 물품은 완충 포장이 필요합니다. 완충재로 감싸 포장했는지 확인해 주세요."

[parcel_items.rules.restricted_goods]
kind = "prohibited"
terms = ["의약품", "마약", "음란물", "처방약", "불법 물품"]
guidance = "의약품·마약류·음란물 등 FAQ에서 운송을 제한한 물품은 접수할 수 없습니다."

[parcel_items.rules.format]
kind = "format"
terms = ["쇼핑백", "비닐봉지", "스티로폼", "박스 없이", "포장 없이"]
guidance = "서류와 소형·중형·대형 박스로 접수합니다. 지원하는 규격으로 포장할 수 있는지 확인해 주세요."

# 백엔드 배송 전화번호 계약(수령인 집전화 허용). 한글 숫자/+82 정규화 뒤 적용한다.
[phone.mobile]
prefixes = ["010", "011", "016", "017", "018", "019"]
min_digits = 11
max_digits = 11

[phone.seoul]
prefixes = ["02"]
min_digits = 9
max_digits = 10

[phone.regional]
prefixes = ["031", "032", "033", "041", "042", "043", "044", "051", "052", "053", "054", "055", "061", "062", "063", "064"]
min_digits = 10
max_digits = 11

[phone.internet]
prefixes = ["070"]
min_digits = 11
max_digits = 11

# --- 필드 목록. 이름은 Business State·BE 매핑과 같다(backend_client/order.py) ---
# kind: free = Backend가 strict 도구 인자로 추출(Live가 위임) · choice = Decision 질문 · auto = 서버가 채움(묻지 않음)
# scope: parcel = 택배마다 · call = 통화당 1개
[fields.sender_name]
label = "보내는 분 성함"
kind = "free"
[fields.sender_phone]
label = "보내는 분 연락처"
kind = "auto"                 # 발신번호. 묻지도 읽지도 않는다
[fields.sender_address]
label = "발송 주소"
kind = "free"
[fields.sender_address_detail]
label = "발송지 상세주소"
kind = "free"
[fields.receiver_name]
label = "받는 분 성함"
kind = "free"
[fields.receiver_phone]
label = "받는 분 연락처"
kind = "free"
[fields.receiver_address]
label = "받는 곳 주소"
kind = "free"
[fields.receiver_address_detail]
label = "받는 곳 상세주소"
kind = "free"
[fields.items]
label = "물품(서류·박스 크기와 개수)"
kind = "free"
[fields.item_price]
label = "물건 가격"
kind = "free"
# 결제 방식은 필드가 아니다: 묻지도 안내하지도 않고 서버가 고객 자격으로 정한다(app/domain/assess.auto_payment, 2026-11-05)

# --- 단계(받는 순서 고정: README "반드시 지킬 것" 1). required 순서가 곧 묻는 순서 ---
[[stage]]
id = "intent"
goal = "고객의 용건(접수·조회·취소·문의·상담원)을 파악한다"
decision = "intent"

[[stage]]
id = "sender"
goal = "보내는 분 성함과 발송 주소·상세를 받는다. 보내는 분 연락처는 발신번호로 채우고 묻지 않는다"
required = ["sender_name", "sender_address", "sender_address_detail"]
decision = "collect"

[[stage]]
id = "receiver"
goal = "받는 분 성함·연락처와 받는 곳 주소·상세를 받는다"
required = ["receiver_name", "receiver_phone", "receiver_address", "receiver_address_detail"]
decision = "collect"

[[stage]]
id = "item"
goal = "물품을 처음 물을 때는 '어떤 물품을 보내시나요?'라고 묻는다. 서류는 개수, 박스는 크기와 개수를 확인한다. item_price가 필요하면 서류를 제외한 물품의 대략적인 가액을 받는다. 무게는 묻지 않는다"
required = ["items", "item_price"]
decision = "collect"

[[stage]]
id = "readback"
goal = "서버가 준 확인 내용을 그대로 읽고 맞는지 묻는다"
gate = "server"
decision = ["confirm", "collect"]

[[stage]]
id = "more_parcels"
goal = "더 보낼 택배나 다른 도움이 필요한지 묻는다. 담은 택배는 접수 전까지 고객 요청 시 수정할 수 있다"   # P5
decision = ["more", "collect"]

[[stage]]
id = "closing"
goal = "서버가 종료를 지시하면 정해진 마무리 인사만 한다"
gate = "server"
decision = "collect"          # 문의·끝내기(end)를 계속 듣는다(S5: closing에서 질문이 없어 "끊어주세요"를 못 들음)

[pickup]
# 수거 요청 시각(사용자 결정 2026-11-04 a, BE 계약 backend/docs/ai-call-follow-up.md). 서버가 기본값을 정하고 되읽기 때 안내,
# 고객이 원하면 아래 범위에서 바꾼다. BE는 pickupRequestedAt을 보존(결제가 늦으면 BE가 결제+1시간을 09~17시로 맞춤)
min_lead_minutes = 60         # 지금부터 최소 1시간 뒤
open = "09:00"
close = "17:00"               # 정각 허용
max_days_ahead = 3            # 현재 시각부터 정확히 3일(72시간) 이내
next_day_default = "09:00"    # 오늘 영업 시간을 넘기면 다음 날 이 시각

[reask]
max_attempts = 3              # 같은 항목 3회 실패 → 다른 방법 제안 → 상담원 제안
vary_wording = true

[confirm]
yes_min = 0.7                 # G4 θ_yes (S5에서 대본으로 조정)
change_max = 0.3              # change 확률이 이 이상이면 yes로 보지 않음
answer_after_readback_tolerance_ms = 300   # G3 허용오차

[address]
ambiguous = "auto_select_top" # P6

[forbid]
items = [
  "서버가 확인하지 않은 주소·전화번호를 확정된 것처럼 말하기",
  "접수 완료·취소 완료·요금·조회 결과를 서버 결과 없이 말하기",
  "서버가 확인 내용을 주기 전에 주문 내용을 되읽거나 확정 질문하기",
  "발신번호 읽기, 주소록에 저장된 번호·상세주소를 묻기 전에 먼저 읽어 주기(고객이 물으면 서버 결과의 값으로 답한다)",
  "결제가 끝났다거나 결제 안내를 보냈다고 말하기",
  "확인 대기 중 고객 확인 없이 '접수 진행하겠다·진행 중이다'라고 말하기. 다른 질문에 답했으면 '이대로 접수할까요?'로 끝낸다",
  "고객이 접수를 요청한 뒤 draft_intake 결과가 오기 전에 접수하겠다·진행하겠다·확인 중이다·아직 확인되지 않았다처럼 접수 여부에 관한 말 하기",
  "스스로 통화 종료하기",
]

[speech]                      # 읽는 규칙(README §5). P8: 지금은 사실·금지 표현만
phone = "고객이 직접 불러 준 번호만 숫자를 끊어 읽는다"
address = "주소를 다시 물을 때는 시·구와 도로명·건물번호로 읽는다. 확인(confirm_route·readback)에서는 서버가 준 동 이름만 말하고 도로명·번지·상세주소는 읽지 않는다"
amount = "접수번호와 요금은 서버가 준 값만 말한다"
pickup = "수거 시각은 먼저 묻지 않는다. 서버 결과 pickup의 시각을 되읽기 때 안내하고, 고객이 바꾸고 싶어 하면 그 시각으로 기록을 요청한다"

# --- 서버 결과 읽는 법(Live 지시문에 렌더링). 서버는 사실(JSON)만 보낸다 — 키의 뜻을 여기서 정한다 ---
[results]
parcel_added = "택배 정보를 고객에게 확인받았다. draft_intake가 failed 또는 not_ready이면 그 상태의 안내를 따르고, 그 밖에는 followup_help를 따른다"
draft_intake = "ready이면 followup_help를 따른다. failed이면 '접수 중 문제가 생겨 접수를 마치지 못했습니다.'라고 말하고 agent 안내를 따른다. not_ready이면 접수에 필요한 정보가 부족하다고 안내한 뒤 더 보내실 택배가 있거나 다른 도움이 필요한지 묻는다"
followup_help = "ask이고 draft_intake가 없거나 ready이면 '접수했습니다. 더 보내실 택배가 있거나 다른 도움이 필요하신가요?'라고 한 번 묻는다. clarify이면 '어떤 도움이 필요하신가요?'라고 한 번만 묻는다"
next_parcel_field = "이전 택배의 발송 주소를 확인할 수 없을 때 묻는 추가 택배의 첫 누락 항목"
orders = "조회 결과가 여러 건이고 lookup_order가 없으면 고객이 구분할 수 있는 받는 분 이름, 접수 시각 또는 받는 지역으로 어느 택배인지 먼저 확인한다. 조회 후보의 번호는 고객에게 말하지 않는다. 후보를 고르기 전에 개별 택배 정보를 읽지 않는다. 취소에서는 서버의 기존 대상 확인을 따른다"
lookup_order = "선택된 택배의 조회 결과. status_text로 상태를 안내하고 고객이 요청한 항목을 함께 답한다. 전체 접수 내용을 확인해 달라고 하면 확인된 발송 주소·받는 곳 주소·물품·가액·요금 등 관련 정보를 짧게 정리한다. 주소를 안내할 때는 해당 기본주소와 같은 쪽 상세주소를 함께 말한다. 상세주소만 물으면 해당 상세주소만 답한다. 상세주소 값이 빈 문자열이면 별도 상세주소가 없다고 답하고, 필드가 빠졌으면 확인할 수 없다고 답한다. 배송 요청 사항은 고객이 묻는 경우에 안내하고, 그 안에 포함된 연락처나 상세주소는 읽지 않는다. 같은 택배에 대한 추가 질문은 이 결과를 사용한다. 없는 정보는 앞선 대화에서 추정하지 않는다. READY는 '이번 통화에서 접수된 택배입니다'라고 말하고 통화 종료 후 처리 문구나 접수 직후 안내를 반복하지 않는다. sender_address는 '발송 주소'라고 말한다"
cancel_current = "none이면 지금 수집 중인 취소 대상이 없다. 이미 담은 다른 택배의 취소는 대상부터 확인한다"
cancel_lookup = "새 취소 대상을 찾는 요청이다. 이번 통화·직전 통화 범위를 지켜 lookup_orders를 부른다. 한 주문의 모든 택배를 취소하라고 명시했을 때만 whole_order를 전달한다"
cancel_target = "서버가 확인할 취소 대상과 question이다. question을 그대로 묻고 고객 답을 기다린다. scope가 whole_order이면 같은 주문의 택배 전부가 취소 대상이다"
cancel_confirmation_pending = "서버가 취소 확인을 처리하고 있다. 같은 질문을 반복하거나 취소했다고 말하지 않고 서버 결과를 기다린다"
readback = "서버가 준 접수 확인 내용(sender_name·from·to·receiver_name). 이 결과를 받으면 바로 같은 응답에서 접수 내용을 요약한다. 고객이 끼어들지 않으면 '{sender_name}님이 {from}에서 {to}의 {receiver_name}님께 보내시는 것으로 확인했습니다. 이대로 접수할까요?'라고 말한다. 요약해도 되는지 먼저 묻거나 중간에 고객의 답을 기다리지 않는다. 고객이 끼어들면 공통 끼어들기 규칙을 따른다. 주소·연락처·상세주소·물품·가액은 다시 읽지 않는다. 고객이 그대로 접수하라고 명확히 요청하면 서버의 확인 결과를 기다린다. 짧은 맞장구는 서버의 접수 확인 질문을 끝까지 들은 뒤에 답해야 동의로 처리할 수 있다"
