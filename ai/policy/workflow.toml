submitted = "order가 submitted면 접수가 이미 넘어가 이 통화에서는 택배를 고치거나 더 담을 수 없다. 바꿨다·담았다고 말하지 않고, 변경은 담당자가 확인 후 연락드린다고 안내한다"

# --- Decision 질문(서버가 고객 발화 끝에 POST /v1/decisions로, delegation.md §3.2). 선택형만 ---
[[decision.intent.questions]]
name = "task"
type = "choice"
choices = ["order", "lookup", "cancel", "inquiry", "agent", "end", "chit_chat", "unclear"]
instructions = "고객 발화의 용건을 고른다. 택배 접수 정보 제공은 order, 보낸 택배 조회는 lookup, 취소는 cancel, 서비스 질문은 inquiry, 상담원 요청은 agent, 명확한 통화 종료는 end, 인사·맞장구·대기 요청은 chit_chat. 직전 AI 발화가 통화를 끝낼지 물었고 고객이 동의하면 end. 접수 중단인지 통화 종료인지 불분명하면 unclear. 직전 AI 발화가 택배 접수를 도와드릴지 물었고 고객이 동의하거나 진행을 바라면(예·네·해 주세요·아뇨 그냥 해 주세요) order. 이번 택배의 보내는 분 성함이나 발송 주소를 바꾸겠다는 답도 order다. 직전 AI 발화가 상담원 연결을 권했고 고객이 동의하면 agent."

[[decision.collect.questions]]
name = "switch"
type = "choice"
choices = ["none", "edit_parcel", "lookup", "cancel", "inquiry", "agent", "end"]
instructions = "고객이 하던 업무와 다른 일을 하려는지 고른다. 상담원 연결이나 통화 종료를 명확히 요청하면 확인 답이 섞여 있어도 각각 agent 또는 end다. 직전 AI 발화가 통화를 끝낼지 물었고 고객이 동의하면 end. 접수 중단인지 통화 종료인지 불분명하면 none. 직전 AI 발화가 상담원 연결을 권했고 고객이 동의하면 agent. 접수 정보를 말하거나 질문에 답하면 none, 이미 담은 택배를 고치려 하면 edit_parcel, 보낸 택배 조회는 lookup, 취소는 cancel, 서비스 질문은 inquiry. 지금 입력하거나 접수 확인 중인 택배의 주소·성함 등 값을 정정하는 말은 none이며, 확인 질문의 내용 정정이면 confirm=change다. 아까 담은 첫 번째 택배처럼 다른 기존 택배를 수정 대상으로 지정하면 edit_parcel이며 confirm=not_answer다. 수정할 택배를 고르는 질문에 답하면 pick에서만 고르고 switch는 none이다."

[[decision.confirm.questions]]
name = "confirm"
type = "choice"
choices = ["yes", "no", "change", "proceed", "not_answer"]
instructions = "고객이 상담원 연결이나 통화 종료를 요청하거나, 직전 연결·종료 질문에 답하면 not_answer. 접수 내용이나 취소 대상을 고치면 접수를 해 달라는 말이 섞여도 change다. 지금 확인하는 택배가 아니라 아까 담은 다른 택배를 수정하겠다는 요청은 not_answer이며 switch=edit_parcel이다. 직전 AI가 확인 질문을 끝까지 말했고 고객이 그 질문에 '맞아요', '접수해 주세요' 등으로 명확히 동의하면 yes, 부정하면 no다. 질문이 끝나기 전 현재 내용대로 접수하라고 명시적으로 지시하면 proceed. 다른 대화 중 명확히 접수를 진행해 달라는 말도 proceed로 고르며 서버가 시점을 검증한다. 되읽기 중 짧은 네·맞아요는 yes로 넘기되 proceed로 해석하지 않는다. 그 밖은 not_answer."

[[decision.more.questions]]
name = "more"
type = "choice"
choices = ["more", "no_more", "clarify", "not_answer"]
instructions = "접수 뒤 더 보낼 택배나 다른 도움이 필요한지 묻는 질문 또는 이어지는 용건 확인에 답하면 고른다. 추가 택배라고 명확히 말하면 more, 추가 요청이 전혀 없다고 답하면 no_more, 도움이 있다고만 하고 용건을 말하지 않으면 clarify다. 조회·취소·서비스 문의·상담원 요청·명확한 통화 종료는 switch에서만 고른다. 다른 질문의 답은 not_answer다."

[[decision.callback.questions]]
name = "callback"
type = "choice"
choices = ["yes", "no", "not_answer"]
instructions = "직전 AI 발화가 상담원 대신 담당자가 나중에 연락드려도 되는지 물었고 고객이 답했으면 고른다: 좋다=yes, 싫다=no. 답이 아니면 not_answer."

[[decision.origin.questions]]
name = "origin"
type = "choice"
choices = ["yes", "no", "not_answer"]
instructions = "기존 발송 주소를 그대로 쓰면 yes, 다른 발송 주소를 쓰면 no다. 직전 AI가 '발송 주소도 바꾸시겠어요?'라고 물었으면 '네'는 no(새 주소), '아니요'는 yes(기존 주소)다. 기존 발송 주소에서 보내는지 물었으면 명확한 동의는 yes다. 고객이 새 택배 접수 의사만 밝혀 기존 주소 사용 여부를 알 수 없으면 not_answer다. 보내는 분 성함을 바꾸겠다는 말이 있으면 일반적인 접수 동의나 인사에 대한 '네'만으로는 주소까지 동의한 것으로 보지 않는다. 고객이 주소는 그대로 쓴다고 명확히 말하면 yes, 주소도 바꾸거나 다른 발송 주소를 직접 말하면 no다. 고객이 '○○로 보낼게요'처럼 받는 곳만 말하고 발송 주소에 답하지 않으면 not_answer다. 접수 제안에 '아니요'라고만 하거나 주소 질문의 답이 아니면 not_answer."

[[decision.sender_change.questions]]
name = "sender_change"
type = "choice"
choices = ["name", "address", "both", "none"]
instructions = "발송 주소를 안내한 인사에 답하거나 그 뒤에 이어서 말한 고객 발화에서 이번 택배의 보내는 분 정보 변경을 찾는다. 직전 질문이 받는 분 성함이고 고객이 그 이름만 답하면 none이다. 보내는 분 성함을 바꾸거나 다른 사람 이름으로 보낸다는 뜻이 분명하면 name이다. 이름 변경 앞에 '아니요'가 붙었다는 이유만으로 주소 변경까지 선택하지 않는다. 발송 주소만 바꾸거나 다른 곳에서 보낸다=address, 고객이 둘 다 바꾸겠다고 밝히면 both. 받는 분 변경, 단순 접수 동의·거절, 고객 정보만 수정하겠다는 용건은 none."

[[decision.sender_name_scope.questions]]
name = "sender_name_scope"
type = "choice"
choices = ["once", "save", "once_pending", "save_pending", "confirm_once", "confirm_save", "not_answer"]
instructions = "고객이 새 보내는 분 성함을 말하면서 그 이름을 이번 택배에만 쓰라고 명시하면 once, 등록 이름에도 쓰라고 명시하면 save다. 다른 보내는 분 성함을 쓰겠다는 뜻과 범위는 분명하지만 아직 실제 이름을 말하지 않았으면 각각 once_pending, save_pending이다. 직전 AI가 이미 기록한 등록 이름 변경 여부를 물었고 고객이 새 이름을 제시하지 않은 채 동의하면 confirm_save, 거절하면 confirm_once다. 질문에 답하면서 새 성함을 다시 고치면 그 새 성함에 대한 적용 범위가 명확할 때만 once 또는 save다. 받는 분 성함, 주소 변경, 택배 접수의 동의나 거절, 적용 범위를 말하지 않은 새 성함은 not_answer."

[[decision.sender_address_save.questions]]
name = "sender_address_save"
type = "choice"
choices = ["yes", "no", "not_answer"]
instructions = "직전 AI가 이번 택배의 발송 주소를 등록 주소로도 바꿀지(다음에도 이 주소에서 보낼지) 물었을 때의 답만 판단한다. 등록 주소도 바꾸라는 동의는 yes, 이번에만 쓰거나 등록 주소는 그대로 두라는 답은 no다. 발송 주소를 다른 값으로 고치는 말, 받는 분·물품 정보, 택배 접수의 동의나 거절, 다른 질문에 대한 답은 not_answer다."

[[decision.box.questions]]
name = "box"
type = "choice"
choices = ["yes", "no", "not_answer"]
instructions = "직전 상담원 발화가 현재 후보의 박스 크기와 개수를 묻는 질문이고 고객이 동의하면 yes, 다른 값을 말하지 않고 거절하면 no다. 다른 규격이나 개수를 직접 말한 정정, 전체 접수 승인, 다른 질문에 대한 답은 not_answer다."
