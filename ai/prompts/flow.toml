# 진행 상태 문구. 서버가 "다음에 할 말"을 만들 때 쓴다(spec/flow.md).
# [say]의 키는 spec/LANGGRAPH_REBUILD.md 표의 ID이고, 값은 다이어그램 문구 글자 그대로다. {…}는 실행 때 바꿔 넣는 값이다.
# 음성 모델이 표현을 다듬을 수는 있지만 {…} 값(이름·주소·금액·날짜·배송 상태)은 바꾸지 않는다(voice.md).
# 공통 말하기 규칙은 voice.md에 한 번만 둔다. 기동 시 모든 문구가 있는지, 자리표시자가 맞는지 검사한다.
# 쓸 수 있는 자리표시자: {company} {now} {caller} {customer_type} {customer_name} {parcel_no} {parcel_count}
#   {성함} {기존 출발지} {도착지 주소} {수신인} {후보} {운임} {월} {일} {받는 분} {주소} {배송 상태} {업무} {항목} {새 값}

# 진행 상태(thinking.append) 틀. then은 받을 항목이 두 개 이상 남았을 때만 붙는다(기록이 한 박자 늦어 같은 질문을 되풀이하지 않게)
progress = "[진행 상태] {stage}. 기록: {recorded}. 다음: {next}{then}"
progress_then = " (고객이 방금 답했고 아직 기록 전이면 그다음: {next2})"
# 답을 고르는 질문일 때 답마다 바로 이어서 할 말(engine.preview). 판별보다 음성 모델이 먼저 말을 시작하므로
progress_preview = " (고객 답에 따라 바로 이어서 할 말 — {items})"
progress_preview_item = "{choice}이면 {next}"
progress_item = "{label} {value}"
progress_sep = ", "
# 기록된 값 대신 보여 줄 말(읽지 않을 값)
saved_value = "저장됨(읽지 않음)"
caller_value = "지금 전화하신 번호"
# 기록된 값이 없을 때·빈 값(상세주소 없음)일 때
empty_value = "없음"

# 지시문 끝에 붙는 통화 정보. first는 시작 단계의 첫 질문(진행 상태보다 먼저 인사할 수 있어 여기에도 넣는다)
call_info = "\n\n## 통화 정보\n- 발신번호: {caller}\n- 고객 유형: {customer_type}\n- 등록 고객 성함: {customer_name}\n- 전화 받은 시각(한국 시간): {received}\n- 첫 질문: {first}"
# 백엔드 지시문 끝에 붙는 통화 정보(수거 일시를 "내일 8시"처럼 말해도 계산하게)
backend_info = "\n\n# 통화 정보\n- 전화 받은 시각(한국 시간): {received}"
# 백엔드 지시문 끝에 붙여 상태가 바뀔 때마다 갱신하는 지금 상태(session.update). state는 도구 결과의 state와 같은 내용
backend_state = "\n\n# 지금 상태(서버가 바뀔 때마다 갱신, 도구 결과의 state가 더 최신)\n{state}"

# 고객 답 처리 중 오류가 났을 때 음성 모델에 주는 안내
answer_error = "[진행 상태] 방금 요청을 처리하지 못했습니다. '죄송합니다, 잠시 문제가 있었습니다.'라고 사과하고 같은 질문으로 다시 한 번 확인을 받으세요."


# 음성 모델이 기록을 맡기지 않은 고객 말을 서버가 백엔드에 직접 넘길 때(app/listener.py record_heard, 기본 꺼짐)
record_heard = "[서버 전달] 음성 상담원이 기록을 맡기지 않은 고객 말입니다: \"{heard}\"\n주문 정보가 있으면 record_order로 들은 그대로 기록하세요. 주문 정보가 없으면 도구를 부르지 말고 '기록할 것 없음'이라고만 답하세요."

# 질문의 핵심 구간이 나가기 전에 고객이 답했을 때 한 번 다시 묻게 한다(LANGGRAPH_REBUILD §2.5(1))
# 고객 말 없이 서버가 단계를 옮겼을 때(확정·검색 시간 초과·취소 결과) 말하게 하는 문구(session.commentary.append)
speak = "지금 고객에게 이어서 말하세요: {next}"
reask = "[진행 상태] 고객이 질문을 끝까지 듣기 전에 답해서 답으로 받지 않았습니다. 같은 질문을 다시 하세요: {next}"

# 음성 모델이 그래프와 다르게 스스로 통화를 끝내려 할 때 바로잡는다(§2.5(7), session.instructions.append)
drift_fix = "통화는 아직 끝나지 않았습니다. 스스로 마무리 인사를 하거나 통화를 끝내지 말고 진행 상태의 '다음'을 따르세요."
drift_markers = ["좋은 하루 보내세요", "이용해 주셔서 감사합니다"]

# 고객 말 판별 지시문(app/listener.py). 선택지는 서버가 단계마다 붙인다
classifier = """전화 택배 상담에서 고객이 한 말을 판별합니다.
answer: 상담원이 방금 물은 질문에 대한 고객의 답을 선택지에서 고르세요. 답이 없거나 애매하면 none. 추측하지 마세요.
intent: 질문과 별개의 용건이 있으면 고르고, 없으면 none. 서비스·요금·배송·포장·이용 방법을 묻는 질문은 question, 상담원을 찾거나 AI가 처리할 수 없는 요청(민원·보상·분실·결제 오류·지난 주문 수정)은 restricted, 이미 말한 접수 정보를 고치면 correction, "잠깐만요"처럼 기다려 달라거나 방금 답을 번복하면 wait, 통화를 끝내려 하면 end.
slot: intent가 correction일 때 고치려는 항목. 아니면 none.
고객 말이 여러 마디면 가장 마지막 말을 기준으로 합니다. 받아쓰기에는 오류가 있을 수 있습니다."""

