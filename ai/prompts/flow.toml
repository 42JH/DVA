# 진행 상태 문구. 서버가 "다음에 할 일"을 만들 때 쓴다(spec/flow.md).
# 공통 말하기 규칙(되읽지 않기·번호 읽기·주소 듣기 등)은 voice.md에 한 번만 두고, 여기에는 그 차례에 할 말만 짧게 둔다.
# 쓸 수 있는 자리표시자: {company} {order_no} {goodbye_message} {recent_order}
#   {saved_origins} {save_candidates} {caller} {customer_type} {customer_name}
# 기동 시 모든 단계·항목의 문구가 있는지, 자리표시자가 맞는지 검사한다.

# 진행 상태(thinking.append) 틀. then은 빠진 항목이 두 개 이상일 때만 붙는다(기록이 한 박자 늦어 같은 질문을 되풀이하지 않게)
progress = "[진행 상태] {stage}. 기록: {recorded}. 다음: {next}{then}"
progress_then = " (고객이 방금 답했고 아직 기록 전이면 그다음: {next2})"
progress_item = "{label} {value}"
progress_sep = ", "
# 기록된 값 대신 보여 줄 말(읽지 않을 값)
saved_value = "저장됨(읽지 않음)"
caller_value = "지금 전화하신 번호"
# 기록된 값이 없을 때·빈 값(상세주소 없음)일 때
empty_value = "없음"

# 지시문 끝에 붙는 통화 정보. first는 시작 단계의 첫 질문(진행 상태보다 먼저 인사할 수 있어 여기에도 넣는다)
call_info = "\n\n## 통화 정보\n- 발신번호: {caller}\n- 고객 유형: {customer_type}\n- 등록 고객 성함: {customer_name}\n- 첫 질문: {first}"

# 고객 답 처리(접수·저장 등) 중 오류가 났을 때 음성 모델에 주는 안내
answer_error = "[진행 상태] 방금 요청을 처리하지 못했습니다. '죄송합니다, 잠시 문제가 있었습니다.'라고 사과하고 같은 질문으로 다시 한 번 확인을 받으세요."

# 고객 답 판별 지시문(app/listener.py). 선택지는 서버가 단계마다 붙인다
classifier = """전화 택배 접수에서 고객이 한 말을 판별합니다.
answer: 상담원이 방금 물은 질문에 대한 고객의 답을 선택지에서 고르세요. 답이 없거나 애매하면 none. 추측하지 마세요.
intent: 고객이 이 질문과 별개로 다른 용건(조회·수정·취소·상담원·종료·새 주문·처리할 수 없는 요청 등)을 말했으면 고르고, 아니면 none.
고객 말이 여러 마디면 가장 마지막 말을 기준으로 합니다. 받아쓰기에는 오류가 있을 수 있습니다."""

[customer_types]
new = "처음 이용하는 고객"
registered = "등록 고객(지난 주문이나 저장된 배송지가 있음)"

# 기록된 값을 보여 줄 때의 이름
[labels]
sender_name = "보내는 분"
sender_phone = "보내는 분 번호"
sender_address = "출발지"
sender_address_detail = "출발지 상세"
receiver_name = "받는 분"
receiver_phone = "받는 분 번호"
receiver_address = "도착지"
receiver_address_detail = "도착지 상세"
item = "물품"

# 항목을 물을 때 할 일(수집 단계에서 빠진 첫 항목. 순서는 신규·등록 고객이 다르다)
