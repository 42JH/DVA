# 진행 상태 문구. 서버가 "다음에 할 일"을 만들 때 쓴다(spec/flow.md).
# 쓸 수 있는 자리표시자: {company} {order_no} {goodbye_message} {recent_order}
#   {saved_origins} {save_candidates} {caller} {customer_type}
# 기동 시 모든 단계·항목의 문구가 있는지, 자리표시자가 맞는지 검사한다.

# 진행 상태(thinking.append) 틀
progress = "[진행 상태] 단계: {stage}. 기록된 값: {recorded}. 다음에 할 일: {next}"
progress_item = "{label}={value}"
progress_sep = ", "

# 지시문 끝에 붙는 통화 정보
call_info = "\n\n[통화 정보] 발신번호: {caller}. 고객 유형: {customer_type}."

# 고객 답 처리(접수·저장 등) 중 오류가 났을 때 음성 모델에 주는 안내
answer_error = "[진행 상태] 방금 요청을 처리하지 못했습니다. 고객에게 잠시 문제가 있다고 사과하고 다시 한 번 확인을 받거나, 계속되면 상담원 연결을 안내하세요."

# 고객 답 판별 지시문(app/listener.py). 선택지는 서버가 단계마다 붙인다
classifier = """전화 택배 접수에서 고객이 한 말을 판별합니다.
answer: 상담원이 방금 물은 질문에 대한 고객의 답을 선택지에서 고르세요. 답이 없거나 애매하면 none. 추측하지 마세요.
intent: 고객이 이 질문과 별개로 다른 용건(조회·수정·취소·상담원·종료·새 주문 등)을 말했으면 고르고, 아니면 none.
고객 말이 여러 마디면 가장 마지막 말을 기준으로 합니다. 받아쓰기에는 오류가 있을 수 있습니다."""

[customer_types]
new = "신규 고객"
registered = "등록 고객(저장된 배송지나 지난 주문이 있음)"

