# AI 서버 + RAG용 Qdrant(원본 ai/compose.yaml 기준). 저장소 루트에서 `docker compose up -d --build`.
# 비밀값은 .env(커밋 금지, 항목은 .env.example)에서 읽는다.
# ai 서비스는 새 서버 app/main.py(관제 /monitor 포함)를 띄운다(Dockerfile CMD).
name: dva-ai-rebuild

services:
  # RAG 벡터 DB. 밖으로 열지 않는다(rag_net은 internal). 대시보드는 compose.qdrant-dashboard.yaml
  qdrant:
    image: qdrant/qdrant:v1.13.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_net
    restart: unless-stopped

  ai:
    image: ${AI_IMAGE:-dva-ai-rebuild:local}
    build:
      context: .
    environment:
      TZ: Asia/Seoul
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET:?Set OPENAI_WEBHOOK_SECRET in .env}
      PBX_WEBHOOK_SECRET: ${PBX_WEBHOOK_SECRET:?Set PBX_WEBHOOK_SECRET in .env}
      MONITOR_USER: ${MONITOR_USER:?Set MONITOR_USER in .env}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?Set MONITOR_PASSWORD in .env}
      # Responses 위임 Backend 모델
      BACKEND_MODEL: ${BACKEND_MODEL:-gpt-6-luna}
      BACKEND_EFFORT: ${BACKEND_EFFORT:-low}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # BE. 운영 배포 기본은 실제 BE(원본과 같음). 로컬 시험은 .env에 BACKEND_MOCK=true를 명시한다
      BACKEND_MOCK: ${BACKEND_MOCK:-false}
      BACKEND_API_URL: ${BACKEND_API_URL:?Set BACKEND_API_URL in .env}
      AI_PERSONA_TOKEN: ${AI_PERSONA_TOKEN:-}
      AI_INSIGHTS_TOKEN: ${AI_INSIGHTS_TOKEN:-}
      AI_BUSINESS_TOKEN: ${AI_BUSINESS_TOKEN:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      # RAG: 컨테이너 안에서는 서비스 이름으로 접근
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      RAG_RERANKER_URL: ${RAG_RERANKER_URL:-}
      RAG_RERANKER_API_KEY: ${RAG_RERANKER_API_KEY:-}
      AI_FAQ_TOKEN: ${AI_FAQ_TOKEN:-}
    volumes:
      - rag_state:/app/rag_state
      # 결과·인사이트 아웃박스(재시작 복구)
      - ai_state:/app/state
      # 이미지 재빌드 없이 조정(원본과 같음). 배포는 릴리스 폴더의 config·prompts(apply-faq-runtime.py가 FAQ 운영 선택 반영)
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      # 통화 로그(logs/calls/<trace_id>.json, 전사 포함 — 개인정보)를 호스트에 남긴다(.gitignore 대상)
      - ./logs:/app/logs
      # 주소 보정용 행안부 주소DB(data/address.db). 없으면 보정 없이 뜬다
      - ${ADDRESS_DATA_DIR:-./data}:/app/data:ro
    ports:
      # 앞단 리버스 프록시(TLS)가 붙을 자리. 다른 서비스와 겹치면 .env의 AI_PORT로 바꾼다
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    networks:
      - ai_net
      - rag_net
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

networks:
  ai_net:
    driver: bridge
  rag_net:
    driver: bridge
    internal: true

volumes:
  rag_state:
  ai_state:
  qdrant_data:
