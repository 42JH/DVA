# AI 전화 접수 서버 + 매뉴얼 RAG용 Qdrant. ai/ 에서 `docker compose up -d --build`.
# 고객·주문·배송지는 AI 서버가 저장하지 않고 백엔드 서버 API로 읽고 쓴다(spec/backend-api.md).
# 비밀값은 ai/.env(커밋 금지, 항목은 .env.example)에서 읽는다.
name: dva-ai

services:
  # 매뉴얼 RAG 벡터 DB. 컬렉션·색인·검색 코드는 RAG 담당자 몫(docs/rag-handoff.md)
  qdrant:
    image: qdrant/qdrant:v1.13.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_net
    restart: unless-stopped

  ai:
    # 배포(Jenkinsfile)는 빌더에서 만든 이미지를 보내 AI_IMAGE로 지정하고 --no-build로 띄운다
    image: ${AI_IMAGE:-dva-ai:local}
    build:
      context: .
    environment:
      TZ: Asia/Seoul
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_WEBHOOK_SECRET: ${OPENAI_WEBHOOK_SECRET:?Set OPENAI_WEBHOOK_SECRET in .env}
      # 백엔드 서버 API 주소(예: http://backend:3000). 인증 방식은 백엔드 담당자가 정한다
      BACKEND_API_URL: ${BACKEND_API_URL:?Set BACKEND_API_URL in .env}
      # true면 메모리 가짜 백엔드(재시작하면 데이터가 사라짐)
      BACKEND_MOCK: ${BACKEND_MOCK:-false}
      # 확정 주소의 지번·동명·우편번호·좌표(접수 필수값). 비어 있으면 접수가 미완료로 넘어간다
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      # 페르소나 연동 토큰(백엔드와 같은 값, 32자 이상). 비어 있으면 연동을 끄고 prompts/persona.md를 쓴다
      AI_PERSONA_TOKEN: ${AI_PERSONA_TOKEN:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      # RunPod 준비 전에는 검색만 오류로 안내하고 주문 접수는 계속한다.
      RAG_RERANKER_URL: ${RAG_RERANKER_URL:-}
      RAG_RERANKER_API_KEY: ${RAG_RERANKER_API_KEY:-}
      AI_FAQ_TOKEN: ${AI_FAQ_TOKEN:-}
      # PBX 통화 종료 웹훅 인증 토큰(Authorization: Bearer, PBX와 공유)
      PBX_WEBHOOK_SECRET: ${PBX_WEBHOOK_SECRET:?Set PBX_WEBHOOK_SECRET in .env}
      MONITOR_USER: ${MONITOR_USER:?Set MONITOR_USER in .env}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?Set MONITOR_PASSWORD in .env}
    volumes:
      # 이미지 재빌드 없이 조정: GPT-Live 세션·서버 설정, 프롬프트
      - rag_state:/app/rag_state
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      # 주소 보정용 행안부 주소DB(data/address.db, 약 600MB). 없으면 보정 없이 뜬다(spec/address.md)
      - ${ADDRESS_DATA_DIR:-./data}:/app/data:ro
    ports:
      # 앞단 리버스 프록시(TLS)가 붙을 자리. 공인 HTTPS 연결은 아직 범위 밖
      # 같은 서버의 다른 서비스와 겹치면 .env의 AI_PORT로 바꾼다
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    networks:
      - ai_net
      - rag_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

networks:
  ai_net:
    driver: bridge
  # Qdrant는 밖으로 열지 않는다(ai 서버만 접근)
  rag_net:
    driver: bridge
    internal: true

volumes:
  rag_state:
  qdrant_data:
