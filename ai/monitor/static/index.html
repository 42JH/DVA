<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디바콜 관제</title>
<style>
  /* 원본 ai/app/monitor/static/index.html의 화면 틀. 그래프·접수 주문 화면은 뺐다(router.py 참고) */
  :root { --blue: #2ea3ff; --line: #d6e9fb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; background: #fff; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--blue); color: #fff; padding: 8px 16px; display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 22px; margin: 0; flex: 1; }
  main { flex: 1; display: grid; grid-template-columns: 280px 1fr 1fr; min-height: 0; }
  section { border-right: 1px solid var(--line); overflow: auto; padding: 12px; min-height: 0; }
  h2 { font-size: 18px; color: var(--blue); margin: 8px 0; }
  .call { padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .call.sel { border-color: var(--blue); background: #f0f8ff; }
  .call-status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #555; background: #f2f2f2; }
  .call-status.active { color: #1565c0; background: #e3f2ff; }
  .call-status.ended { color: #c62828; background: #ffebee; }
  .muted { color: #777; font-size: 15px; }
  .bubble { margin: 6px 0; padding: 6px 10px; border-radius: 10px; max-width: 90%; font-size: 16px; }
  .customer { background: #f2f2f2; }
  .agent { background: #e3f2ff; margin-left: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  .tool { border: 1px solid var(--line); border-radius: 8px; padding: 6px; margin: 6px 0; font-size: 15px; }
  .tool pre { white-space: pre-wrap; word-break: break-all; margin: 4px 0 0; max-height: 160px; overflow: auto; }
  .event { font-size: 15px; border-bottom: 1px solid var(--line); padding: 2px 0; }
  .error { color: #c62828; }
</style>
</head>
<body>
<header><h1>디바콜 관제</h1><span id="conn" class="muted"></span></header>
<main>
  <section><h2>통화</h2><div id="calls"></div></section>
  <section><h2>받아쓰기</h2><div id="transcript"></div></section>
  <section><h2>상세</h2><div id="detail"></div><h2>지연(ms)</h2><div id="latency"></div><h2>백엔드 통신</h2><div id="backend"></div><h2>도구 호출</h2><div id="tools"></div><h2>사건</h2><div id="events"></div></section>
</main>
<script>
const calls = new Map();
let selected = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const time = (t) => t ? new Date(t * 1000).toLocaleTimeString("ko-KR") : "";
const show = (v) => v == null || v === "" ? "<span class=muted>-</span>" : typeof v === "object" ? `<pre>${esc(JSON.stringify(v, null, 1))}</pre>` : esc(v);
const callStatus = (status) => {
  const labels = { accepting: "연결 중", active: "통화중", ended: "통화 종료" };
  const color = status === "active" ? "active" : status === "ended" ? "ended" : "";
  return `<span class="call-status ${color}">${esc(Object.hasOwn(labels, status) ? labels[status] : status)}</span>`;
};

function render() {
  const list = [...calls.values()].sort((a, b) => b.started_at - a.started_at);
  if (!selected && list.length) selected = list[0].session_id;
  $("calls").innerHTML = list.map((c) => `<div class="call ${c.session_id === selected ? "sel" : ""}" data-id="${esc(c.session_id)}">
    <b>${esc(c.caller)}</b> <span class="muted">${time(c.started_at)}</span><br>${callStatus(c.status)}${c.stage ? ` · ${esc(c.stage)}` : ""}
    ${c.end_reason ? `<br><span class="muted">종료: ${esc(c.end_reason)}</span>` : ""}</div>`).join("");
  const c = calls.get(selected);
  if (!c) return;
  $("transcript").innerHTML = (c.transcript || []).map((b) => `<div class="bubble ${esc(b.speaker)}">${esc(b.text)}</div>`).join("");
  $("detail").innerHTML = `<table>${Object.entries(c.detail || {}).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${show(v)}</td></tr>`).join("")}</table>
    ${(c.errors || []).map((e) => `<div class="error">${time(e.at)} ${esc(e.message)}</div>`).join("")}`;
  const lat = c.latency || [];
  $("latency").innerHTML = lat.length ? `<table><tr><th>구간</th><th>횟수</th><th>최근</th><th>P50</th><th>P95</th><th>최대</th></tr>${lat.map((r) =>
    `<tr><th>${esc(r["구간"])}</th><td>${r["횟수"]}</td><td>${r["최근"]}</td><td>${r["P50"]}</td><td>${r["P95"]}</td><td>${r["최대"]}</td></tr>`).join("")}</table>` : "<span class=muted>-</span>";
  $("backend").innerHTML = [...(c.backend_calls || [])].reverse().map((b) => `<div class="event ${b.outcome === "ok" ? "" : "error"}"><span class="muted">${time(b.at)}</span>
    <b>${esc(b.op)}</b> · ${esc(b.outcome)}${b.http ? ` · HTTP ${esc(b.http)}` : ""}${b.error ? ` · ${esc(b.error)}` : ""} · ${b.ms}ms</div>`).join("") || "<span class=muted>-</span>";
  $("tools").innerHTML = [...(c.tool_calls || [])].reverse().map((t) => `<div class="tool"><b>${esc(t.name)}</b> · ${esc(t.status)}
    ${t.elapsed_ms != null ? `· ${t.elapsed_ms}ms` : ""}<pre>${esc(t.arguments)}</pre>${t.output ? `<pre>${esc(JSON.stringify(t.output, null, 1))}</pre>` : ""}</div>`).join("");
  $("events").innerHTML = [...(c.events || [])].reverse().map((e) => `<div class="event"><span class="muted">${time(e.at)} ${esc(e.kind)}</span> ${esc(e.text)}</div>`).join("");
}

$("calls").addEventListener("click", (e) => {
  const el = e.target.closest(".call");
  if (el) { selected = el.dataset.id; render(); }
});

const source = new EventSource("/monitor/api/stream");
source.onopen = () => { $("conn").textContent = "연결됨"; };
source.onerror = () => { $("conn").textContent = "다시 연결 중…"; };
source.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === "call") { calls.set(msg.call.session_id, msg.call); render(); }
};
</script>
</body>
</html>
