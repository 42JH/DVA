# 서버 설정 (spec/server-config.md). 기동 시 읽고 검증한다. 고치면 서버를 다시 띄운다.
log_level = "INFO"

[call]
# 동시 통화 상한(OpenAI 동시 세션 한도 안쪽: Build 50 · Launch 300 · Grow 500)
max_concurrent = 20
# 상한 초과·설정 오류일 때 reject 상태 코드(300~699)
reject_status_code = 486
# 마무리 인사 후 음성 출력이 이만큼(초) 멈추면 끊는다
hangup_silence_sec = 1.5
# 마무리 인사를 기다리는 최대 시간(초)
hangup_max_wait_sec = 10.0
# 고객 끊김을 못 알아챈 경우(SIP 종료·PBX 종료 웹훅이 모두 안 옴)의 안전장치: 고객 말이 이만큼(초) 없으면 마무리 인사 후 끊는다
idle_hangup_sec = 60.0
# 통화 최대 길이(초). 넘으면 마무리 인사 후 끊는다
max_call_sec = 1200.0
# 상담원 전환(refer) 대상. 지금은 자리표시자(PBX 담당자에게 받을 값)
refer_target_uri = "sip:agent@example.com"
# 같은 webhook-id를 무시하는 시간(초)
webhook_dedupe_sec = 3600
# 도구 하나의 실행 시간 제한(초)
tool_timeout_sec = 10.0

[business]
company_name = "디포스트콜"
# 확정 요금은 백엔드 확인 전 임의 안내하지 않는다. {parcel_no} 사용 가능
submitted_message = "접수번호는 {parcel_no}입니다. 기사님이 방문해서 수거해 갑니다. 요금은 실제 접수 조건에 따라 확인 후 안내됩니다."
goodbye_message = "디포스트콜을 이용해 주셔서 감사합니다. 좋은 하루 보내세요."

[progress]
# thinking.append 최대 글자 수(500토큰 한도 안쪽, 한글 1글자 ≈ 1토큰 이상으로 잡음)
max_chars = 400

[backend]
# 고객·주문·배송지를 관리하는 백엔드 서버 API(spec/backend-api.md). 주소는 환경변수 BACKEND_API_URL
# 가짜 백엔드 사용 여부는 환경변수 BACKEND_MOCK
# 요청 하나의 시간 제한(초). 통화 시작 조회는 accept 전이라 짧게 둔다
timeout_sec = 3.0
# 상담 결과(POST /api/orders) 요청 하나의 시간 제한(초). 백엔드가 디버 응답을 최대 10초 기다리므로 그보다 길게
submit_timeout_sec = 15.0
# 결과가 불확실할 때(연결 실패·504·202 처리 중·409 처리 중) 같은 키로 다시 확인하는 총 시간(초)
submit_retry_sec = 40.0
# 다시 확인하는 간격(초)
retry_interval_sec = 2.0
# 조회 도구가 돌려주는 최근 주문 수
lookup_limit = 5
# 관제 화면 접수 주문 목록 개수
monitor_orders_limit = 100

[monitor]
# SSE keepalive 간격(초)
sse_keepalive_sec = 15.0
# 끝난 통화를 레지스트리·관제 화면에 남겨 두는 시간(초)
retain_ended_sec = 1800
# 끝난 통화를 남겨 두는 최대 개수
call_history_keep = 100
# 받아쓰기: 같은 사람의 직전 조각과 이 간격(ms) 안이면 겹쳐 말해도 같은 말풍선에 이어 붙인다
bubble_gap_ms = 1500

[address]
# 고객이 말한 주소를 행안부 주소DB로 실제 도로명주소로 보정(spec/address.md). ai/ 기준 경로, 컨테이너에서는 /app/data(볼륨)
# 파일이 없으면 보정을 끄고 들은 그대로 기록한다. 만들기: uv run python -X utf8 -m app.address.db <주소DB 텍스트 폴더> data/address.db
db_path = "data/address.db"
# 확정한 주소의 지번·동명·우편번호·좌표를 카카오 주소 검색으로 채운다. 키는 환경변수 KAKAO_REST_API_KEY(없으면 끔)
kakao_timeout_sec = 3.0

[persona]
# 관리자가 백엔드에서 고친 페르소나(말투·인사 문구·음성)를 다음 통화부터 쓴다(spec/persona.md).
# 연동 토큰은 환경변수 AI_PERSONA_TOKEN(백엔드와 같은 값). 없으면 연동을 끄고 prompts/persona.md를 쓴다
# 적용 대기 중 진행 통화가 끝났는지 보는 간격(초)
wait_poll_sec = 1.0
# 백엔드 조회·회신이 실패했을 때 다시 시도하는 간격(초). 적용 결과가 불명확한 동안은 새 통화를 받지 않는다
retry_sec = 5.0
# 적용 결과 회신 시도 횟수(넘으면 백엔드 ACTIVE를 조회해 맞춘다)
report_attempts = 3
# 관리자 프롬프트 최대 글자 수(넘으면 INVALID_CONFIG로 회신)
max_prompt_chars = 4000

[listener]
# 고객 답 판별(예/아니오·어느 곳·끼어드는 용건). 백엔드 도구 호출 없이 서버가 직접 판별해 대화 상태를 바꾼다
model = "gpt-6-luna"
# none · minimal · low · medium · high(모델마다 다름). 높을수록 판별이 늦다
reasoning_effort = "low"
# 고객 말이 이만큼(ms) 멈추면 판별한다
pause_ms = 600
# 판별 한 번의 시간 제한(초). 넘으면 상태를 바꾸지 않는다
timeout_sec = 5.0
# 판별에 넘기는 고객 말(이번 단계에서 아직 판별하지 않은 말)의 최대 글자 수
max_heard_chars = 400
# 판별에 같이 넘기는 상담원의 직전 말 최대 글자 수
max_agent_chars = 200
# 저장된 배송지를 선택지로 넘길 때 최대 개수
max_choices = 30
# 음성 모델이 위임하지 않은 고객 말을 서버가 백엔드에 직접 넘길지(listener.record_heard).
# 끔: 2026-10-29 통화에서 위임된 FAQ 응답 중에 서버 요청이 끼어들어 답이 돌아오지 않고 상담원이 멈췄다(docs/WORKLOG.md)
record_heard = false

[rag]
# large 통합 Q+A → Kiwi BM25 + 벡터 RRF → Qwen Top5 → 원문 Top3
collection = "manuals_dev_openai_large"
embedding_model = "text-embedding-3-large"
dimensions = 3072
bm25_weight = 0.4
rrf_c = 60
candidate_k = 5
context_k = 3
timeout_sec = 12.0
http_timeout_sec = 5.0
retry_cooldown_sec = 30.0

[client_backend]
# 백엔드는 도구 선택만 한 번. 결과를 받은 뒤의 답변 생성은 Live가 한다.
timeout_sec = 8.0
transcript_wait_sec = 1.0
history_chars = 6000
max_delegations = 100
context_chunk_tokens = 350
append_timeout_sec = 5.0

[faq_sync]
# 운영 관리 색인·실제 Qwen 길이 검증기·Live 연결 전에는 켜지 않는다.
receive_enabled = false
db_path = "rag_state/faq-events.sqlite3"
max_pending = 1000
max_body_bytes = 16384
# 백엔드의2초 HTTP 제한보다 짧게 저장 성공/실패를 응답한다.
accept_timeout_sec = 1.5
busy_timeout_sec = 0.1
# 질문/절 제목/표 머리글을 포함한 문자 수. Qwen 토큰 한도와는 다르다.
chunk_size = 800
chunk_overlap = 50
# 기존 MD 컬렉션과 분리한다. 실제 생성/전환은 명시적인 최초 이전에서 수행한다.
collection = "manuals_backend_faq_large"
embedding_batch_size = 32
# 자동 소비자 코드가 있어도 실제 운영 색인 주입/Live 연결 전에는 비활성이다.
process_enabled = false
poll_sec = 1.0
retry_base_sec = 5.0
retry_max_sec = 300.0
reconcile_sec = 30.0
