# 서버 설정 (spec/server-config.md). 기동 시 읽고 검증한다. 고치면 서버를 다시 띄운다.
log_level = "INFO"

[call]
# 동시 통화 상한(OpenAI 동시 세션 한도 안쪽: Build 50 · Launch 300 · Grow 500)
max_concurrent = 20
# 상한 초과·설정 오류일 때 reject 상태 코드(300~699)
reject_status_code = 486
# 마무리 인사 후 음성 출력이 이만큼(초) 멈추면 끊는다
hangup_silence_sec = 1.5
# 마무리 인사를 기다리는 최대 시간(초)
hangup_max_wait_sec = 10.0
# 상담원 전환(refer) 대상
refer_target_uri = "sip:agent@example.com"
# 같은 webhook-id를 무시하는 시간(초)
webhook_dedupe_sec = 3600
# 도구 하나의 실행 시간 제한(초)
tool_timeout_sec = 10.0

[business]
company_name = "디포스트콜"
# 확정 요금은 백엔드 확인 전 임의 안내하지 않는다. {order_no} 사용 가능
submitted_message = "접수번호는 {order_no}입니다. 기사님이 방문해서 수거해 갑니다. 요금은 실제 접수 조건에 따라 확인 후 안내됩니다."
goodbye_message = "디포스트콜을 이용해 주셔서 감사합니다. 좋은 하루 보내세요."

[progress]
# thinking.append 최대 글자 수(500토큰 한도 안쪽, 한글 1글자 ≈ 1토큰 이상으로 잡음)
max_chars = 400

[backend]
# 고객·주문·배송지를 관리하는 백엔드 서버 API(spec/backend-api.md). 주소는 환경변수 BACKEND_API_URL
# 요청 하나의 시간 제한(초). 통화 시작 조회는 accept 전이라 짧게 둔다
timeout_sec = 3.0
# 조회 도구가 돌려주는 최근 주문 수
lookup_limit = 5
# 관제 화면 접수 주문 목록 개수
monitor_orders_limit = 100

[monitor]
# SSE keepalive 간격(초)
sse_keepalive_sec = 15.0
# 끝난 통화를 레지스트리·관제 화면에 남겨 두는 시간(초)
retain_ended_sec = 1800
# 끝난 통화를 남겨 두는 최대 개수
call_history_keep = 100
# 받아쓰기: 같은 사람의 직전 조각과 이 간격(ms) 안이면 겹쳐 말해도 같은 말풍선에 이어 붙인다
bubble_gap_ms = 1500

[listener]
# 고객 답 판별(예/아니오·어느 곳·끼어드는 용건). 백엔드 도구 호출 없이 서버가 직접 판별해 대화 상태를 바꾼다
model = "gpt-6-luna"
# none · minimal · low · medium · high(모델마다 다름). 높을수록 판별이 늦다
reasoning_effort = "low"
# 고객 말이 이만큼(ms) 멈추면 판별한다
pause_ms = 600
# 판별 한 번의 시간 제한(초). 넘으면 상태를 바꾸지 않는다
timeout_sec = 5.0
# 판별에 넘기는 고객 말(이번 단계에서 아직 판별하지 않은 말)의 최대 글자 수
max_heard_chars = 400
# 판별에 같이 넘기는 상담원의 직전 말 최대 글자 수
max_agent_chars = 200
# 저장된 배송지를 선택지로 넘길 때 최대 개수
max_choices = 30

[rag]
# large 통합 Q+A → Kiwi BM25 + 벡터 RRF → Qwen Top5 → 원문 Top3
collection = "manuals_dev_openai_large"
embedding_model = "text-embedding-3-large"
dimensions = 3072
bm25_weight = 0.4
rrf_c = 60
candidate_k = 5
context_k = 3
timeout_sec = 12.0
http_timeout_sec = 5.0
retry_cooldown_sec = 30.0

[client_backend]
# 백엔드는 도구 선택만 한 번. 결과를 받은 뒤의 답변 생성은 Live가 한다.
timeout_sec = 8.0
transcript_wait_sec = 1.0
history_chars = 6000
max_delegations = 100
context_chunk_tokens = 350
append_timeout_sec = 5.0
