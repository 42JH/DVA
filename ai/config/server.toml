# 서버 설정. 지금은 원본 RAG(app/rag/)가 읽는 [rag]·[faq_sync]만 둔다(app/config.py 호환판이 이 두 섹션만 읽는다).
# 두 섹션은 원본 S15P31D109/ai config/server.toml에서 그대로 옮겼다(RAG 담당, 수정 금지).

# [backend].timeout_sec는 원본 RAG 스크립트도 읽는다(원본 값). 나머지 키는 새 서버 BE 게이트웨이 설정.
[rag]
# large 통합 Q+A → Kiwi BM25 + 벡터 RRF → Qwen Top5 → 원문 Top3
collection = "manuals_dev_openai_large"
embedding_model = "text-embedding-3-large"
dimensions = 3072
bm25_weight = 0.4
rrf_c = 60
candidate_k = 5
context_k = 3
timeout_sec = 12.0
http_timeout_sec = 5.0
retry_cooldown_sec = 30.0
# RAG Yes/No: 1등 근거의 리랭커 점수(yes/no 로짓 차이)가 이보다 낮으면 답할 자료 없음. 주석이면 근거 유무만 본다
# TODO(flow): 평가셋으로 임계값을 정한다(scripts/calibrate_relevancy.py)
# min_score = 0.0

[faq_sync]
# 운영 관리 색인·실제 Qwen 길이 검증기·Live 연결 전에는 켜지 않는다.
receive_enabled = false
db_path = "rag_state/faq-events.sqlite3"
max_pending = 1000
max_body_bytes = 16384
# 백엔드의2초 HTTP 제한보다 짧게 저장 성공/실패를 응답한다.
accept_timeout_sec = 1.5
busy_timeout_sec = 0.1
# 질문/절 제목/표 머리글을 포함한 문자 수. Qwen 토큰 한도와는 다르다.
chunk_size = 800
chunk_overlap = 50
# 기존 MD 컬렉션과 분리한다. 실제 생성/전환은 명시적인 최초 이전에서 수행한다.
collection = "manuals_backend_faq_large"
embedding_batch_size = 32
# 자동 소비자 코드가 있어도 실제 운영 색인 주입/Live 연결 전에는 비활성이다.
process_enabled = false
poll_sec = 1.0
retry_base_sec = 5.0
retry_max_sec = 300.0
reconcile_sec = 30.0

[backend]
parcel_draft_intake = false  # 055 백엔드와 연동 검증 후 전환한다.
timeout_sec = 3.0
# 새 서버 전용(app/integrations/backend/gateway.py). 측정 후 조정
max_concurrency = 16
read_budget_sec = 3.0
write_budget_sec = 5.0
submit_timeout_sec = 15.0
submit_retry_sec = 40.0
# SENT_UNCERTAIN(503·연결 끊김·시간 초과) 주문 결과를 실행 중에도 같은 키·본문으로 재확인하는 주기. 0이면 재시작 때만
result_resend_sec = 60.0
# 분석 hasCallbackRequest: 048 + 새 BE(feature/ai-call-updates) 배포 후 true로(구버전 BE는 400)
analysis_callback_field = false

[fare]
# 원본 S15P31D109/ai config/server.toml [fare] 그대로(2026-10-31 결정).
# 배송비 요금표(원, 규격 하나당, VAT 포함). 택배 배송비(notifiedPrice) = 규격별 개수 × 요금의 합, 주문 총액(totalAmount) = 택배 합계.
# 백엔드는 배송비를 계산하지 않고 접수(COMPLETE) 때 검사만 한다(docs/contracts/be-api.md §8). 값이 없는 규격이나 기타 물품이 있으면
# 배송비를 모르는 것으로 보고 금액을 말하지 않으며, 통화 결과는 미완료(INCOMPLETE)로 넘긴다(운영자가 금액을 보완).
# 방문수거는 유인 지점 요금(2026-10-31 결정). 무인 지점은 서류 4950·소형 5500·중형 6600·대형 8800
document = 3850
small_box = 4950
medium_box = 6050
big_box = 7150

[call]
# 통화 생명주기(docs/architecture/call-lifecycle.md §2). 측정 후 조정
max_active_calls = 20
stage1_budget_sec = 1.5
stage2_budget_sec = 3.0
persona_budget_sec = 1.0
persona_retry_sec = 5.0
persona_report_attempts = 3
persona_max_prompt_chars = 20000
recent_destinations = 5
closing_quiet_ms = 1200
closing_result_wait_sec = 5.0
closing_max_sec = 15.0
silence_sec = 30.0
expire_margin_sec = 60.0
finalize_wait_sec = 5.0
unanswered_agent_after = 3   # 매뉴얼 검색 연속 미답변 → 상담원 권유(업무 규칙)
# 상담원 연결(업무 규칙 e). 전환 대상 SIP URI가 비면 전환하지 않는다(미준비). 근무 시간 밖이면 콜백 제안(임시 시간)
agent_transfer_uri = ""
agent_open = "09:00"
agent_close = "18:00"
agent_days = [0, 1, 2, 3, 4]   # 월~금

[unanswered_review]
# S15P31D109-159. 모델은 기존 BACKEND_MODEL 사용. 통화 중 추가 호출 없음.
# 2026-11-04 백엔드 배포 완료 사용자 확인 + 가상 통화 실모델 8건 통과.
# 이 설정은 AI 코드가 배포된 후 적용된다. false면 기존 종료 기록 경로로 돌아간다.
enabled = true
reason_contract_enabled = true
# 2026-11-05 운영 DB의 052 테이블·실행 중 백엔드의 배열 DTO 확인 완료.
faq_answered_enabled = true
timeout_sec = 30.0
max_input_chars = 100000
max_output_tokens = 6000
max_attempts = 3
poll_sec = 30.0
